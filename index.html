<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tabelão Vinculado · Anapro × 118 × Movfin</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" defer></script>
<style>
/* cores com significado: vermelho = risco/crítico · laranja = alto · âmbar = atenção · verde = conforme/resolvido · azul = informação/andamento · cinza = neutro.
   vinho = identidade Metrocasa (marca e ações principais), nunca para indicar situação. */
:root{--vinho:#5C0A10;--vinho2:#7A1520;--rosa:#F8E8E9;--rl:#EFD2D4;--tinta:#1A1416;--graf:#6B6065;--graf2:#8C8287;
  --crit:#C41420;--crit-bg:#FDECEC;--crit-bd:#F1B8BB;
  --alto:#C2410C;--alto-bg:#FDF0E7;--alto-bd:#F3C6A8;
  --med:#A16207;--med-bg:#FEF7E0;--med-bd:#EFD48A;
  --ok:#1F7A5C;--ok-bg:#E8F3EE;--ok-bd:#A9D3C1;
  --info:#1F4E8C;--info-bg:#EAF0F8;--info-bd:#B3C7E3;
  --neu:#6B6065;--neu-bg:#F1EEEF;--neu-bd:#D9D2D4;
  --bg:#F6F4F4;--card:#fff;--line:#E6E1E2;--line2:#F1EDEE;--sh:0 1px 2px rgba(26,20,22,.05)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;font-size:13px;color:var(--tinta);background:var(--bg);height:100vh;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
.num{font-variant-numeric:tabular-nums}
/* cabeçalho e navegação */
.hd{display:flex;align-items:center;gap:12px;height:54px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line)}
.hd img{height:24px}.hd .t{font-family:'Space Grotesk';font-weight:700;font-size:16px;color:var(--vinho);letter-spacing:-.02em;white-space:nowrap}
.nav{display:flex;gap:2px;margin-left:14px;height:100%}
.nav button{white-space:nowrap;border:0;background:none;padding:0 13px;height:100%;cursor:pointer;font-weight:600;font-size:13px;color:var(--graf);border-bottom:2px solid transparent;margin-bottom:-1px}
.nav button:hover{color:var(--tinta)}.nav button.on{color:var(--vinho);border-bottom-color:var(--vinho)}
.nav button .bd{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--crit);color:#fff;font-size:10.5px;line-height:17px;text-align:center}
.hd .sp{flex:1}
.who{position:relative}.who>button{border:1px solid var(--line);background:#fff;border-radius:18px;padding:4px 10px 4px 4px;display:flex;align-items:center;gap:7px;cursor:pointer;font-size:12px}
.who .av{width:26px;height:26px;border-radius:50%;background:var(--vinho);color:#fff;display:grid;place-items:center;font-weight:700;font-size:11px}
.menu{position:absolute;right:0;top:38px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(26,20,22,.14);min-width:250px;padding:6px;z-index:25;display:none}
.menu.on{display:block}.menu .mi{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:12.5px}
.menu .mi:hover{background:var(--neu-bg)}.menu .mo{display:none}.menu .mh{padding:8px 10px 6px;font-size:11.5px;color:var(--graf);border-bottom:1px solid var(--line2);margin-bottom:4px;line-height:1.45}
.btn{border:1px solid var(--vinho);background:var(--vinho);color:#fff;border-radius:7px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:12.5px;white-space:nowrap}
.btn:hover{background:var(--vinho2)}.btn:disabled{opacity:.5;cursor:default}
.btn.g{background:#fff;color:var(--vinho);border-color:var(--line)}.btn.g:hover{border-color:var(--vinho);background:#fff}
.btn.sm{padding:4px 9px;font-size:12px}.btn.q{border-color:transparent;background:none;color:var(--graf)}.btn.q:hover{color:var(--tinta);background:var(--neu-bg)}
.app{display:grid;grid-template-columns:286px 1fr;height:calc(100vh - 54px)}
/* painel de filtros */
.side{background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:12px 12px 40px}
.srch{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#FBFAFA}
.srch:focus,.fin:focus{outline:2px solid var(--rl);border-color:var(--vinho)}
.blk{margin-top:12px;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#FCFBFB}
.blk h3{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--graf);font-weight:700;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.blk h3 .sp{flex:1}
.vsel{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 7px;background:#fff}
.row{display:flex;gap:6px;align-items:center;margin-top:7px}.row>*{flex:1;min-width:0}
.fin{border:1px solid var(--line);border-radius:6px;padding:5px 6px;background:#fff;font-size:12px;width:100%}
.qk{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}.qk button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:2px 8px;font-size:11px;cursor:pointer;color:var(--graf)}
.qk button:hover{border-color:var(--graf2);color:var(--tinta)}.qk button.on{border-color:var(--info);color:var(--info);background:var(--info-bg)}
.grp{margin-top:14px}
.grp>h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta);font-weight:700;padding:4px 2px;cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none}
.grp>h2::before{content:"▾";color:var(--graf2);font-size:10px;width:10px}.grp.fech>h2::before{content:"▸"}
.grp>h2 .n{margin-left:auto;background:var(--info);color:#fff;border-radius:9px;padding:0 6px;font-size:10px;line-height:16px}
.grp.fech .fac{display:none}
.fac{margin:2px 0}
.fac h4{font-size:12.6px;color:var(--tinta);font-weight:500;display:flex;align-items:center;cursor:pointer;user-select:none;gap:8px;padding:6px 8px;border-radius:6px}
.fac h4::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--graf2);flex:none}
.fac h4:hover{background:var(--neu-bg);color:var(--vinho)}.fac.on h4{background:var(--neu-bg);font-weight:600}
.fac.tem h4::before{background:var(--info)}.fac.tem h4{color:var(--info)}
.fac h4 .s{background:var(--info);color:#fff;border-radius:9px;padding:0 7px;font-size:10.5px;font-weight:700;line-height:17px}
.fac h4 i{font-style:normal;color:var(--graf2);font-size:11px;margin-left:auto}
.fac .bx{display:none;padding:2px 0 8px 14px}.fac.on .bx{display:block}
.fac .ops{margin-top:4px;max-height:250px;overflow-y:auto}
.fdica{font-size:11px;color:var(--graf);margin:2px 2px 6px;line-height:1.35}
.fbt{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;padding-left:2px}.fbt a{font-size:11.3px;color:var(--info);cursor:pointer}.fbt a:hover{text-decoration:underline}
.op{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:5px;cursor:pointer;font-size:12.3px;line-height:1.25;user-select:none}
.op:hover{background:var(--neu-bg)}
.op .bl{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid var(--c,var(--graf2));display:grid;place-items:center;font-size:9px;font-weight:800;color:#fff;line-height:1}
.op.on{background:var(--info-bg)}.op.on .bl{background:var(--c,var(--info));border-color:var(--c,var(--info))}.op.on .bl::after{content:"✓"}.op.on span.l{font-weight:600}
.op span.l{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.op span.n{color:var(--graf);font-variant-numeric:tabular-nums;font-size:11.3px}
.op.z{opacity:.42}
.dot{width:8px;height:8px;border-radius:50%;flex:none;border:1px solid}
.fsr{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:5px;padding:4px 7px;font-size:12px}
/* área principal */
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;padding:9px 18px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:46px}
.chips{display:flex;gap:5px;flex-wrap:wrap;flex:1;min-width:0;align-items:center}
.chip{background:var(--info-bg);color:var(--info);border:1px solid var(--info-bd);border-radius:12px;padding:2px 9px;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
.chip:hover{border-color:var(--info)}.chip b{font-weight:500;opacity:.8}
.cnt{font-size:12px;color:var(--graf);white-space:nowrap}.cnt b{color:var(--tinta)}
.fbtn{display:none}
.pane{flex:1;min-height:0;display:none;flex-direction:column}.pane.on{display:flex}
.scroll{overflow-y:auto;flex:1;min-height:0}
/* visão geral */
.ov{padding:18px 20px 40px;max-width:1400px}
.hero{display:flex;gap:18px;align-items:flex-start;margin-bottom:14px}
.hero h1{font-family:'Space Grotesk';font-size:22px;color:var(--tinta);letter-spacing:-.02em;font-weight:700}
.hero .lead{font-size:14.5px;line-height:1.55;color:var(--tinta);margin-top:6px;max-width:900px}
.hero .lead b{font-weight:700}.hero .lead .r{color:var(--crit)}.hero .lead .g{color:var(--ok)}
.hero .meta{font-size:11.5px;color:var(--graf);margin-top:6px}
.ring{flex:none;width:118px;text-align:center}.ring svg{display:block;margin:0 auto}.ring span{display:block;font-size:10.5px;color:var(--graf);letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin-top:3px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.kc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px 10px;cursor:pointer;position:relative;box-shadow:var(--sh);transition:border-color .12s}
.kc:hover{border-color:var(--graf2)}
.kc::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.kc .l{font-size:11px;font-weight:600;color:var(--graf);display:flex;align-items:center;gap:6px}
.kc .v{font-family:'Space Grotesk';font-size:26px;font-weight:700;color:var(--c);line-height:1.15;margin-top:3px;font-variant-numeric:tabular-nums}
.kc .v small{font-family:Inter;font-size:12px;color:var(--graf);font-weight:500;margin-left:6px}
.kc .d{font-size:11px;color:var(--graf);margin-top:2px;min-height:15px}
.kc .d .up{color:var(--crit);font-weight:600}.kc .d .dn{color:var(--ok);font-weight:600}
.g2{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.cd{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px 16px;box-shadow:var(--sh);min-width:0}
.cd>h3{font-family:'Space Grotesk';font-size:15px;font-weight:600;color:var(--tinta);display:flex;align-items:baseline;gap:8px}
.cd>h3 small{font-family:Inter;font-weight:500;font-size:11.5px;color:var(--graf)}
.cd>.sub{font-size:12px;color:var(--graf);margin:3px 0 10px;line-height:1.45}
.ins{font-size:12px;line-height:1.5;background:var(--neu-bg);border-radius:7px;padding:8px 10px;margin-top:10px;color:var(--tinta)}
.ins.w{background:var(--med-bg)}.ins.r{background:var(--crit-bg)}.ins.k{background:var(--ok-bg)}
.al-l{display:flex;flex-direction:column;gap:2px}
.ai{display:grid;grid-template-columns:20px 1fr 64px;gap:8px;align-items:center;padding:6px 6px;border-radius:7px;cursor:pointer}
.ai:hover{background:var(--neu-bg)}
.ai .t{font-size:12.5px;font-weight:600;line-height:1.3;min-width:0}.ai .t small{display:block;font-weight:400;color:var(--graf);font-size:11.3px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai .q{text-align:right;font-family:'Space Grotesk';font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.ai .q small{display:block;font-family:Inter;font-weight:500;color:var(--graf);font-size:10.5px}
.hb{height:5px;background:var(--neu-bg);border-radius:3px;margin-top:4px;overflow:hidden}.hb i{display:block;height:100%;border-radius:3px}
.lv{width:10px;height:10px;border-radius:50%;border:1.5px solid;flex:none}
.lv.CRÍTICO{background:var(--crit-bg);border-color:var(--crit)}.lv.ALTO{background:var(--alto-bg);border-color:var(--alto)}.lv.MÉDIO{background:var(--med-bg);border-color:var(--med)}
.lv.CONFORME{background:var(--ok-bg);border-color:var(--ok)}.lv.INCONCLUSIVO{background:var(--neu-bg);border-color:var(--neu)}
.et{width:100%;border-collapse:collapse;font-size:12.2px}
.et th{font-size:10.3px;letter-spacing:.06em;text-transform:uppercase;color:var(--graf);font-weight:600;text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
.et th:first-child,.et td:first-child{text-align:left}
.et td{padding:6px 6px;border-bottom:1px solid var(--line2);text-align:right;font-variant-numeric:tabular-nums}
.et tr.ck{cursor:pointer}.et tr.ck:hover td{background:#FCFAFA}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;letter-spacing:.02em;white-space:nowrap}
.tag.r{background:var(--crit-bg);color:var(--crit)}.tag.w{background:var(--med-bg);color:var(--med)}.tag.k{background:var(--ok-bg);color:var(--ok)}.tag.i{background:var(--info-bg);color:var(--info)}.tag.n{background:var(--neu-bg);color:var(--neu)}
.stk{display:flex;height:22px;border-radius:5px;overflow:hidden;gap:2px}
.stk i{display:block;height:100%;border:1px solid;border-radius:4px;min-width:3px;cursor:pointer}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:11.5px;color:var(--graf)}.lg span{display:flex;align-items:center;gap:5px;cursor:pointer}.lg b{color:var(--tinta);font-variant-numeric:tabular-nums}
.st{display:flex;flex-direction:column;gap:9px}
.si{display:flex;gap:10px;align-items:flex-start;cursor:default}.si.ck{cursor:pointer}
.si .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.si .ic.k{background:var(--ok-bg);color:var(--ok)}.si .ic.w{background:var(--med-bg);color:var(--med)}.si .ic.r{background:var(--crit-bg);color:var(--crit)}.si .ic.i{background:var(--info-bg);color:var(--info)}.si .ic.n{background:var(--neu-bg);color:var(--neu)}
.si .tx{font-size:12.3px;line-height:1.4}.si .tx b{font-family:'Space Grotesk';font-size:15px}.si .tx small{display:block;color:var(--graf);font-size:11.3px}
.spark{margin-top:8px}
.vz{padding:50px 20px;text-align:center;color:var(--graf)}.vz h4{font-family:'Space Grotesk';color:var(--tinta);font-size:16px;margin-bottom:6px}.vz .btn{margin-top:12px}
/* tabela de unidades */
.kp{display:flex;gap:8px;padding:10px 18px 0;flex-wrap:wrap}
.kq{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12px}
.kq:hover{border-color:var(--graf2)}.kq b{font-family:'Space Grotesk';font-size:15px;font-variant-numeric:tabular-nums}.kq.on{border-color:var(--info);background:var(--info-bg)}
.tw{flex:1;margin:10px 18px 14px;background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden;box-shadow:var(--sh)}
.th,.tr{display:grid;grid-template-columns:var(--gc);align-items:center}
.th{background:#FBFAFA;border-bottom:1px solid var(--line);font-size:10.3px;letter-spacing:.06em;text-transform:uppercase;color:var(--graf);font-weight:600}
.th .gp{grid-column:span var(--s);padding:6px 8px 2px;border-bottom:2px solid;font-size:10px;letter-spacing:.1em}
.th .h{padding:5px 8px 6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.th .h:hover{color:var(--tinta)}
.th .h.s{color:var(--tinta)}.th .h.s::after{content:" ▾"}.th .h.s.asc::after{content:" ▴"}
.g-a{border-color:#C98088!important;color:var(--vinho)}.g-e{border-color:var(--vinho)!important;color:var(--vinho)}.g-m{border-color:var(--info)!important;color:var(--info)}.g-c{border-color:var(--graf)!important}
.tb{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.tr{height:38px;border-bottom:1px solid var(--line2);cursor:pointer;position:absolute;left:0;right:0;box-shadow:inset 3px 0 0 var(--lc,transparent)}
.tr:hover{background:#FCF8F8}.tr.sel{background:var(--rosa)}
.tr.CRÍTICO{--lc:var(--crit)}.tr.ALTO{--lc:var(--alto)}.tr.MÉDIO{--lc:#E0B341}
.tr>div{padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.2px;line-height:1.25}
.tr .emp{font-weight:600}.tr .un{font-family:'Space Grotesk';font-weight:600;font-variant-numeric:tabular-nums}
.sub{display:block;font-size:10.8px;color:var(--graf);overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.pl{display:inline-block;padding:1px 7px;border-radius:9px;font-size:10.8px;font-weight:600;white-space:nowrap;background:var(--neu-bg);color:var(--neu)}
.pl.v{background:var(--ok-bg);color:var(--ok)}.pl.d{background:var(--crit-bg);color:var(--crit)}.pl.p{background:var(--med-bg);color:var(--med)}.pl.inf{background:var(--info-bg);color:var(--info)}
.cr{display:inline-block;padding:1px 7px;border-radius:9px;font-size:10.5px;font-weight:700;letter-spacing:.03em;border:1px solid}
.cr.CRÍTICO{background:var(--crit);border-color:var(--crit);color:#fff}.cr.ALTO{background:var(--alto-bg);border-color:var(--alto-bd);color:var(--alto)}.cr.MÉDIO{background:var(--med-bg);border-color:var(--med-bd);color:var(--med)}
.cr.CONFORME{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok)}.cr.INCONCLUSIVO{background:var(--neu-bg);border-color:var(--neu-bd);color:var(--neu)}
.cl{font-weight:600;font-size:11.3px}.cl.MESMO{color:var(--ok)}.cl.PROVÁVEL{color:var(--med)}.cl.DIFERENTE{color:var(--crit)}.cl.UM,.cl.SEM,.cl.GENÉRICO{color:var(--graf);font-weight:500}
.tt{display:inline-block;font-size:10px;font-weight:700;padding:0 5px;border-radius:7px;margin-left:4px;vertical-align:1px}
.tt.em_tratativa{background:var(--info-bg);color:var(--info)}.tt.corrigido{background:var(--ok-bg);color:var(--ok)}.tt.falso_positivo,.tt.aceito{background:var(--neu-bg);color:var(--neu)}.tt.volta{background:var(--crit-bg);color:var(--crit)}
/* empreendimentos */
.emw{padding:16px 20px 40px}
.emt{width:100%;border-collapse:separate;border-spacing:0;font-size:12.3px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--sh)}
.emt th{position:sticky;top:0;background:#FBFAFA;font-size:10.3px;letter-spacing:.06em;text-transform:uppercase;color:var(--graf);font-weight:600;text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
.emt th:hover{color:var(--tinta)}.emt th.s{color:var(--tinta)}
.emt th:first-child,.emt td:first-child{text-align:left}
.emt td{padding:7px 8px;border-bottom:1px solid var(--line2);text-align:right;font-variant-numeric:tabular-nums}
.emt tr:hover td{background:#FCF8F8;cursor:pointer}
.emt td.z{color:#C9C1C4}
.mini{display:flex;height:9px;width:150px;border-radius:3px;overflow:hidden;gap:1px;margin-left:auto}.mini i{display:block;height:100%}
/* ficha */
.dr{position:fixed;top:0;right:0;width:min(780px,94vw);height:100vh;background:#fff;box-shadow:-8px 0 30px rgba(26,20,22,.18);transform:translateX(105%);transition:transform .18s;z-index:20;display:flex;flex-direction:column}
.dr.on{transform:none}.drh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}

<script>

const SB={url:'https://jspfqktrbimrarimpzgh.supabase.co',key:'sb_publishable_v5q-FJsZbsufq31dqi3zlA_ddzJQ_f-'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const HOJE=new Date();const isoD=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const iso=s=>{s=String(s||'');let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=s.match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?m[3]+'-'+m[2]+'-'+m[1]:null};
const isoHM=s=>{const m=String(s||'').match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/);return m?`${m[3]}-${m[2]}-${m[1]} ${m[4]}:${m[5]}`:null};

/* ------------------------------------------------ Supabase */
let SES=null,INFO=null;
const sbH=t=>({'Content-Type':'application/json',apikey:SB.key,...(t?{Authorization:'Bearer '+t}:{})});
async function sbCall(url,opt){const r=await fetch(url,opt);const tx=await r.text();let j=null;try{j=tx?JSON.parse(tx):null}catch(e){}
  if(!r.ok){const e=new Error((j&&(j.message||j.error_description||j.msg||j.error))||('HTTP '+r.status));e.status=r.status;throw e}return j}
const sesSalva=()=>{try{SES?localStorage.setItem('tab_sb',JSON.stringify({email:SES.email,refresh:SES.refresh})):localStorage.removeItem('tab_sb')}catch(e){}};
let _ren=null;function sbRenova(){return _ren||(_ren=_sbRenova().finally(()=>_ren=null))}
async function _sbRenova(){const j=await sbCall(SB.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:sbH(),body:JSON.stringify({refresh_token:SES.refresh})});SES.access=j.access_token;SES.refresh=j.refresh_token;sesSalva()}
async function rpc(fn,args={}){if(!SES.access)await sbRenova();

async function entra(){const em=$('#ge').value.trim(),se=$('#gs').value;if(!em||!se){$('#gm').textContent='Informe e-mail e senha.';return}

  catch(e){SES=null;sesSalva();$('#gm').textContent=msgErro(e)}finally{$('#gg').disabled=false}}

const idb=()=>new Promise((ok,er)=>{const r=indexedDB.open('tabelao',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>er(r.error)});
async function idbGet(k){try{const d=await idb();return await new Promise(ok=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})}catch(e){return null}}
async function idbSet(k,v){try{const d=await idb();await new Promise(ok=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=ok;t.onerror=ok})}catch(e){}}

/* baixa em páginas menores, 4 de cada vez, e tenta de novo a página que falhar (a API do Supabase às vezes engasga) */
async function baixaUnidades(prog){
  const tot=INFO.total||0,P=2500,pags=Math.max(1,Math.ceil(tot/P));let feitas=0;
  const tarefas=[...Array(pags).keys()];const res=new Array(pags);prog(0,tot,'');
  async function pag(i){for(let t=1;;t++){try{return (await rpc('tab_unidades',{p_offset:i*P,p_limit:P})).rows}
    catch(e){if(t>=4||/sem_permissao/.test(e.message))throw e;prog(feitas*P,tot,'o banco demorou; tentando de novo ('+t+'/3)…');await new Promise(r=>setTimeout(r,1500*t))}}}
  async function w(){while(tarefas.length){const i=tarefas.shift();res[i]=await pag(i);feitas++;prog(Math.min(feitas*P,tot),tot,'')}}
  await Promise.all([w(),w(),w(),w()]);const rows=res.flat();
  await idbSet('unidades',{versao:INFO.versao,rows,info:{versao:INFO.versao,corte_118:INFO.corte_118,reconstruido_em:INFO.reconstruido_em}});return rows}

const STOP=new Set(['DE','DA','DO','DAS','DOS','E']);
const nm=s=>String(s||'').replace(/�/g,'?').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z? ]/g,' ').replace(/\s+/g,' ').trim();
const toks=s=>nm(s).split(' ').filter(t=>t.length>=2&&!STOP.has(t));
const teq=(a,b)=>a===b||(a.length===b.length&&[...a].every((c,i)=>c===b[i]||c==='?'||b[i]==='?'));
const RANK={IGUAL:6,'IGUAL (grafia)':5,'NOME AMPLIADO':4,'NOME ALTERADO':3,'SÓ 1º NOME':1,'DIFERENTE':0};
function lev1(a,b){if(a===b)return true;if(Math.min(a.length,b.length)<4||Math.abs(a.length-b.length)>1)return false;
  let i=0,j=0,d=0;while(i<a.length&&j<b.length){if(a[i]===b[j]||a[i]==='?'||b[j]==='?'){i++;j++;continue}if(++d>1)return false;
    if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}}return d+(a.length-i)+(b.length-j)<=1}
const feq=(a,b)=>teq(a,b)||lev1(a,b);
/* IGUAL · IGUAL (grafia) = 1 letra de diferença · NOME AMPLIADO = um nome contém o outro inteiro (ex.: casou e ganhou "SILVA")
   NOME ALTERADO = mesmo 1º nome e mais um nome em comum, com sobrenome trocado · SÓ 1º NOME · DIFERENTE */
function cmpPar(x,y){const A=toks(x),B=toks(y);if(!A.length||!B.length)return null;
  const exa=A.filter(a=>B.some(b=>teq(a,b))).length;
  if(exa===A.length&&exa===B.length)return 'IGUAL';
  const ab=A.filter(a=>B.some(b=>feq(a,b))).length,ba=B.filter(b=>A.some(a=>feq(a,b))).length,pri=feq(A[0],B[0]);
  if(ab===A.length&&ba===B.length)return 'IGUAL (grafia)';
  if(pri&&(ab===A.length||ba===B.length)&&Math.min(A.length,B.length)>=2)return 'NOME AMPLIADO';
  if(pri&&ab>=2)return 'NOME ALTERADO';
  if(!pri&&ab>=2&&ab>=Math.min(A.length,B.length)-1)return 'NOME ALTERADO';
  if(pri)return 'SÓ 1º NOME';return 'DIFERENTE'}
const partes=s=>String(s||'').split(/\s*[,|;]\s*/).map(x=>x.trim()).filter(Boolean);
function cmpNomes(x,y){let best=null;for(const a of partes(x))for(const b of partes(y)){const r=cmpPar(a,b);if(r&&(best===null||RANK[r]>RANK[best]))best=r}return best}
function cmpPessoa(x,princ,seg){if(seg&&bom(cmpNomes(seg,princ)))seg=null;const a=cmpNomes(x,princ),b=seg?cmpNomes(x,seg):null;
  if(b&&(a===null||RANK[b]>RANK[a])&&RANK[b]>=4)return {r:b,seg:true};return {r:a,seg:false}}
const bom=r=>r&&RANK[r]>=4;
const ns=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();
const generico=s=>/CLIENTE PADR/i.test(nm(s));

/* ------------------------------------------------ andar, bloco e final a partir do código da unidade */
function posicao(un,tipo){const r={bloco:'',andar:'—',andarN:999,final:''};let m=String(un||'').match(/^([^-]+)-(.+)$/);
  if(m){r.bloco=m[1]==='U'?'Torre única':'Bloco '+m[1];const x=m[2];
    if((m=x.match(/^(\d{2})(\d{2})$/))){const n=+m[1];r.andarN=n;r.andar=n===0?'Térreo':n+'º andar';r.final=m[2]}
    else if((m=x.match(/^(\d)S(\d{2})$/))){r.andarN=+m[1]?-(+m[1]):-0.5;r.andar=+m[1]?m[1]+'º subsolo':'Subsolo';r.final=m[2]}
    else if((m=x.match(/^0S(\d{2})$/))){r.andarN=-0.5;r.andar='Subsolo';r.final=m[1]}
    else if(/^V|^M0/.test(x)){r.andar='Vaga';r.andarN=900}
    else if(/^S0/.test(x)){r.andar='Subsolo';r.andarN=-0.5}
    else if(/^LO/.test(x)){r.andar='Loja';r.andarN=901}}
  else if((m=String(un).match(/^(\d{1,2})(\d{2})$/))){const n=+m[1];r.andarN=n;r.andar=n===0?'Térreo':n+'º andar';r.final=m[2]}
  else if(/VAGA/i.test(un)){r.andar='Vaga';r.andarN=900}else if(/LOJA/i.test(un)){r.andar='Loja';r.andarN=901}
  if(/VAGA/i.test(tipo||''))r.andar='Vaga',r.andarN=900;if(/LOJA/i.test(tipo||''))r.andar='Loja',r.andarN=901;
  return r}
const anoEntrega=s=>{const m=String(s||'').match(/(\d{4})/);return m?m[1]:'—'};

const ANDN={};
function deriva(r){
  const u={};COLS.forEach((c,i)=>u[c]=r[i]);for(const c of ['a_cliente','e_cliente','m_cliente','m_segundo'])if(u[c]&&/^[-–\s.]*$/.test(u[c]))u[c]=null;

  u.ag=u.a_grupo||'— sem Anapro';u.es=u.e_situacao||'— sem 118';u.ms=u.m_situacao||'— sem movfin';
  u.dt={e:iso(u.e_data_venda),a:iso(u.a_data_venda),m:iso(u.m_data_status)};
  const cA=u.a_cliente&&/VENDIDA|EM PROCESSO/.test(u.a_grupo||'')?u.a_cliente:null;
  const cE=u.e_travada?u.e_cliente:null;
  const cM=u.m_cliente&&u.m_situacao&&u.m_situacao!=='DISTRATO'?u.m_cliente:null;
  const p={};
  /* compradores do mesmo contrato: a lista do Anapro (nomes separados por vírgula) e o titular + 2º do movfin.
     Se cada lado bate com uma pessoa diferente do mesmo grupo, é o mesmo contrato (casal/co-compradores), não cliente diferente. */
  const GR=[];const pa=partes(u.a_cliente);if(pa.length>1&&!generico(u.a_cliente))GR.push(pa);
  if(u.m_cliente&&u.m_segundo)GR.push([u.m_cliente,u.m_segundo]);
  const noGr=(g,x)=>g.findIndex(n=>bom(cmpNomes(x,n)));
  const casal=(x,y)=>GR.some(g=>{const i=noGr(g,x),j=noGr(g,y);return i>=0&&j>=0});
  if(cA&&cE){if(generico(cA))p.ae='GENÉRICO';else{const r=cmpNomes(cA,cE);
    p.ae=!bom(r)&&casal(cA,cE)?'OUTRO COMPRADOR do mesmo contrato':r}}
  const cpf=c=>{const d=String(c||'').replace(/\D/g,'');return d.length===10||d.length===9?d.padStart(11,'0'):d.length===11?d:null};
  const ce=cpf(u.e_cpf),cm=cpf(u.m_cpf);
  if(cE&&cM){if(ce&&cm){const r=cmpNomes(cE,cM);
      if(ce===cm)p.em=/^IGUAL/.test(r||'')?'MESMO CPF':'MESMO CPF · nome mudou ('+(r||'?').toLowerCase()+')';
      else if(/^IGUAL/.test(r||''))p.em='CPF DIFERENTE · mesmo nome';
      else if(u.m_segundo&&bom(cmpNomes(cE,u.m_segundo)))p.em='CPF DIFERENTE · 118 = 2º comprador do movfin';
      else if(casal(cE,cM))p.em='CPF DIFERENTE · OUTRO COMPRADOR do mesmo contrato';
      else p.em='CPF DIFERENTE'}
    else{const x=cmpPessoa(cE,cM,u.m_segundo);p.em=x.seg?x.r+' · 2º comprador':!bom(x.r)&&casal(cE,cM)?'OUTRO COMPRADOR do mesmo contrato':x.r}}
  if(cA&&cM){if(generico(cA))p.am='GENÉRICO';else{const x=cmpPessoa(cA,cM,u.m_segundo);p.am=x.seg?x.r+' · 2º comprador':!bom(x.r)&&casal(cA,cM)?'OUTRO COMPRADOR do mesmo contrato':x.r}}
  u.cmp=p;const v=Object.values(p).filter(x=>x&&x!=='GENÉRICO');
  const tem=re=>v.some(x=>re.test(x));
  const n=[cA&&!generico(cA),cE,cM].filter(Boolean).length;
  if(n===0)u.cli=generico(cA||'')?'GENÉRICO no Anapro':'SEM CLIENTE ATUAL';
  else if(n===1)u.cli='UM SISTEMA SÓ';
  else if(tem(/^DIFERENTE|^CPF DIFERENTE$/))u.cli='DIFERENTE';
  else if(tem(/CPF DIFERENTE · mesmo nome/))u.cli='MESMO NOME, CPF DIFERENTE';
  else if(tem(/^SÓ 1º NOME/))u.cli='PROVÁVEL MESMO (só o 1º nome bate)';
  else if(tem(/NOME AMPLIADO|NOME ALTERADO|nome mudou/))u.cli=tem(/^MESMO CPF/)?'MESMO CLIENTE · nome mudou (CPF confirma)':'PROVÁVEL MESMO · nome mudou (casamento?)';
  else if(tem(/2º comprador|OUTRO COMPRADOR/))u.cli='MESMO CONTRATO · casal / outro comprador';
  else if(v.length)u.cli='MESMO CLIENTE';else u.cli='GENÉRICO no Anapro';
  u.cliNome=cE||cM||cA||u.e_cliente||u.m_cliente||u.a_cliente||'';
  // alertas: [nível, código, detalhe]
  const al=[],ad=(c,d)=>al.push([AL[c][0],c,d||'']);const g=u.a_grupo||'';const aDt=u.dt.a;
  if(u.e_travada&&/DISPONÍVEL/.test(g))ad('TD');
  if(u.e_travada&&!u.a_n)ad('TF');
  if((u.e_n_vig||0)>1)ad('VV',`${u.e_n_vig} vendas vigentes: ${u.e_vendas_vigentes||''}`);
  if(u.e_travada&&/BLOQUEADA|PERMUTA/.test(g))ad('TB',`Anapro: ${u.a_status||''}`);
  if(/VENDIDA/.test(g)&&!u.e_travada){if(aDt&&CORTE&&aDt>CORTE)ad('VC',`Venda no Anapro em ${dBR(aDt)}; corte do 118 em ${dBR(CORTE)}`);else ad('VS',u.e_n_reg?'O 118 só tem vendas canceladas':'Nenhuma venda no 118')}
  if(u.e_n_reg&&!u.e_travada&&!u.a_n)ad('CF');
  if(u.m_situacao&&u.m_situacao!=='DISTRATO'&&u.e_n_reg&&!u.e_travada)ad('RC',`Movfin: ${u.m_situacao}${u.m_sintese?' · '+u.m_sintese:''}`);
  if(u.m_situacao==='DISTRATO'&&u.m_via_contrato&&/VENDA VIGENTE|QUITADA/.test(u.e_situacao||''))ad('DV');
  if(u.e_travada&&/EM PROCESSO/.test(g))ad('TP',`Anapro: ${u.a_status||''}`);
  if(!u.e_travada&&(u.e_n_vig||0)>0)ad('VA',u.e_vendas_vigentes?'Ainda ativa(s): '+u.e_vendas_vigentes:'');
  if(u.cli==='DIFERENTE')ad('CD');
  if(u.e_travada&&u.e_situacao==='VENDA VIGENTE'&&u.e_tipo_venda==='CEF'&&!u.m_n&&u.e_status_escritura!=='PRE-VENDA')ad('CS');
  if(u.cli==='MESMO NOME, CPF DIFERENTE')ad('NC');
  al.sort((a,b)=>ORD[a[0]]-ORD[b[0]]);u.al=al;u.crit=al.length?al[0][0]:(u.presenca==='Anapro'?'INCONCLUSIVO':'CONFORME');
  u.alTxt=al.map(a=>AL[a[1]][1]);u.alC=al.map(a=>a[1]);u.pend=al.length>0;
  u.txt=' '+ns([u.emp,u.un,u.un.replace(/-/g,''),u.a_cliente,u.e_cliente,u.m_cliente,u.m_segundo,u.e_num_venda,u.e_contrato,u.m_contrato_crm,u.m_contrato_fin,u.e_cpf,u.m_cpf].join(' '))+' ';

function filtra(){const act=FAC.map((f,i)=>SEL[f[0]]&&SEL[f[0]].size?i:-1).filter(i=>i>=0);
  const vis=FAC.map((f,i)=>FOPEN.has(f[0])&&!GFECH.has(f[3])?i:-1).filter(i=>i>=0);
  CNT=FAC.map(()=>new Map());const out=[];
  const add=(i,u)=>{const v=u.fv[i],m=CNT[i];if(Array.isArray(v))for(const x of v)m.set(x,(m.get(x)||0)+1);else m.set(v,(m.get(v)||0)+1)};
  for(const u of U){if(!basePassa(u))continue;let nf=0,fi=-1;
    for(const i of act){if(!casa(u.fv[i],SEL[FAC[i][0]])){nf++;fi=i;if(nf>1)break}}
    if(nf>1)continue;

  F=out;ordena()}
function ordena(){const c=ORDEM.c,s=ORDEM.asc?1:-1;const key={emp:u=>u.emp+'|'+u.un,un:u=>u.emp+'|'+String(1000+u.pos.andarN).padStart(6,'0')+'|'+u.un,ana:u=>u.ag,cliA:u=>u.a_cliente||'',e:u=>u.es,cliE:u=>u.e_cliente||'',m:u=>u.ms,cliM:u=>u.m_cliente||'',cli:u=>u.cli,crit:u=>ORD[u.crit]+'|'+(u.alC[0]||'')+'|'+u.emp+'|'+u.un,venda:u=>u.e_data_venda||''}[c]||(u=>u.emp);
  const K=new Map(F.map(u=>[u,key(u)]));F.sort((a,b)=>{const x=K.get(a),y=K.get(b);return x<y?-s:x>y?s:0})}
function facetas(){const h=['<div class="fdica">Abra um filtro e <b>clique nos itens</b> para mostrar só eles. Pode marcar vários. O número ao lado é quantas unidades têm aquele item.</div>'];
  for(const [g,gt] of GRUPOS){const fs=FAC.filter(f=>f[3]===g);const nsel=fs.filter(f=>SEL[f[0]]&&SEL[f[0]].size).length;
    h.push(`<div class="grp ${GFECH.has(g)?'fech':''}"><h2 onclick="togGrp('${g}')">${gt}${nsel?`<span class="n">${nsel}</span>`:''}</h2>`);
    for(const [k,t,,,ord,cor] of fs){const s=SEL[k]||new Set();const on=FOPEN.has(k)&&!GFECH.has(g);
      h.push(`<div class="fac ${on?'on':''} ${s.size?'tem':''}" data-k="${k}"><h4 onclick="togFac('${k}')"><span>${t}</span>${s.size?`<span class="s">${s.size} marcado${s.size>1?'s':''}</span>`:''}<i>${on?'▴':'▾'}</i></h4>`);
      if(on){const cont=CNT[FI[k]];const L=[...valoresFac(k)].sort(ord||((a,b)=>(cont.get(b)||0)-(cont.get(a)||0)||String(a).localeCompare(b)));

        <div class="fbt">${s.size?`<a onclick="limpaFac('${k}')">✕ desmarcar tudo</a><a onclick="invFac('${k}')" title="Mostra todas as opções, menos as marcadas">⇄ trocar: todos menos estes</a>`:`<a onclick="todosFac('${k}')">marcar todos</a>`}</div></div>`)}
      h.push('</div>')}
    h.push('</div>')}

function ring(p){const r=46,c=2*Math.PI*r,v=Math.max(0,Math.min(1,p||0));const cor=v>=.95?'var(--ok)':v>=.85?'var(--med)':'var(--crit)';
  return `<svg width="110" height="110" viewBox="0 0 110 110"><circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--neu-bg)" stroke-width="10"/><circle cx="55" cy="55" r="${r}" fill="none" stroke="${cor}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c*v} ${c}" transform="rotate(-90 55 55)"/><text x="55" y="61" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="21" fill="${cor}">${pc(v,1,1)}</text></svg>`}
function spark(ser){if(!ser||ser.length<2)return '';const W=260,H=46,P=4;const vs=ser.map(s=>s.v);const mx=Math.max(...vs,1),mn=Math.min(...vs,0);
  const x=i=>P+(W-2*P)*i/(ser.length-1),y=v=>H-P-(H-2*P)*(v-mn)/((mx-mn)||1);
  return `<svg class="spark" width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px"><polyline fill="none" stroke="var(--crit)" stroke-width="1.2" stroke-dasharray="3 3" points="${ser.map((s,i)=>x(i)+','+y(s.v)).join(' ')}"/>${ser.map((s,i)=>`<circle cx="${x(i)}" cy="${y(s.v)}" r="2.4" fill="#fff" stroke="var(--crit)" stroke-width="1.2"><title>${esc(s.l)}: ${fmt(s.v)}</title></circle>`).join('')}</svg>`}
function visao(){const el=$('#ov'),n=F.length;
  if(!U.length){el.innerHTML='<div class="vz"><h4>O tabelão ainda não tem dados</h4><p>O administrador precisa subir as bases em Bases e acessos.</p></div>';return}
  if(!n){el.innerHTML='<div class="vz"><h4>Nenhuma unidade nesta seleção</h4><p>Os filtros ativos não deixam nenhuma unidade. Tire algum filtro ou limpe todos.</p><button class="btn" onclick="limpa()">Limpar filtros</button></div>';return}
  const L=contaNiv(F),pend=L['CRÍTICO']+L['ALTO']+L['MÉDIO'],base=n-L.INCONCLUSIVO,filtrado=F.length!==U.length;
  const ac=new Map();for(const u of F)for(const a of u.al)ac.set(a[1],(ac.get(a[1])||0)+1);
  const alL=[...ac].sort((a,b)=>ORD[AL[a[0]][0]]-ORD[AL[b[0]][0]]||b[1]-a[1]);
  const td=ac.get('TD')||0,tf=ac.get('TF')||0,vv=ac.get('VV')||0;
  // frase de situação: só fatos dos dados
  const fr=[];fr.push(`<b>${fmt(n)}</b> unidades ${filtrado?'na seleção':'conciliadas entre Anapro, 118 e movfin'}.`);
  if(L['CRÍTICO']){const p=[];if(td)p.push(`<b>${fmt(td)}</b> travadas no 118 e ainda à venda no Anapro`);if(tf)p.push(`<b>${fmt(tf)}</b> travadas no 118 sem a unidade no Anapro`);if(vv)p.push(`<b>${fmt(vv)}</b> com mais de uma venda vigente no 118`);
    fr.push(`<span class="r"><b>${fmt(L['CRÍTICO'])}</b> críticas (${pc(L['CRÍTICO'],n,1)})</span>${p.length?': '+p.join(', ')+'.':'.'}`)}
  else fr.push('<span class="g">Nenhuma unidade crítica.</span>');
  if(L.ALTO||L['MÉDIO'])fr.push(`Outras <b>${fmt(L.ALTO)}</b> altas e <b>${fmt(L['MÉDIO'])}</b> de atenção.`);
  const abertas=F.filter(u=>TRAT_ABERTA.has(tratSit(u))),abC=abertas.filter(u=>u.crit==='CRÍTICO').length;
  if(pend)fr.push(TRAT.size?`<b>${fmt(abertas.length)}</b> pendências ainda sem tratativa${abC?` (${fmt(abC)} críticas)`:''}.`:'Nenhuma pendência tem tratativa registrada ainda: abra uma unidade e marque o que foi feito.');
  // deltas com a atualização anterior (só sem filtros, para não comparar coisas diferentes)
  const ant=HIST&&HIST.anterior,antR=ant&&HIST.serie.find(s=>s.versao===ant.versao);
  const dl=nv=>{if(filtrado||!antR||!antR.resumo||!antR.resumo.niveis)return '';const d=L[nv]-(antR.resumo.niveis[nv]||0);if(!d)return 'igual à atualização anterior';
    const ruim=nv==='CONFORME'?d<0:d>0;return `<span class="${ruim?'up':'dn'}">${d>0?'+':''}${fmt(d)}</span> desde ${esc(ant.em.slice(0,10))}`};

function desenha(){if(TAB!=='un')return;const tb=$('#tb');$('#sp').style.height=(F.length*RH)+'px';

   <div class="lg2" id="tlog">${t?`Último registro: ${esc(t.por)} em ${esc(dBR(t.em.slice(0,10))+' '+t.em.slice(11))}`:''}</div></div>`}

  <div class="c3">

   <div class="sc" style="border-top-color:var(--info)"><h5 style="color:var(--info)">Movimentação financeira</h5>${u.m_n?dl([['Situação',u.m_situacao],['Fase',u.m_fase],['Síntese',u.m_sintese],['Data status',u.m_data_status],['Cliente',u.m_cliente],['CPF',u.m_cpf],['2º comprador',u.m_segundo],['Banco',u.m_banco],['Contrato CRM',u.m_contrato_crm+(u.m_via_contrato?' (mesmo do 118)':' (≠ venda do 118)')],['Contrato financ.',u.m_contrato_fin],['Minuta',u.m_data_minuta],['Retirada',u.m_data_retirada],['Registros',u.m_n]]):'<p class="note">Sem registro no movfin.</p>'}</div>

function cruz(rows,fr,fc,ordC){const C=new Map(),R=new Map();for(const u of rows){const r=fr(u),c=fc(u);R.set(r,(R.get(r)||0)+1);if(!C.has(c))C.set(c,0);C.set(c,C.get(c)+1)}
  const cols=[...C.keys()].sort(ordC||((a,b)=>C.get(b)-C.get(a)));const rr=[...R.keys()].sort((a,b)=>R.get(b)-R.get(a));
  const m=new Map();for(const u of rows){const k=fr(u)+'\u0001'+fc(u);m.set(k,(m.get(k)||0)+1)}return {cols,rr,R,C,get:(r,c)=>m.get(r+'\u0001'+c)||0}}
function tabCruz(t,x,lim){const rr=lim?x.rr.slice(0,lim):x.rr;const tot=[...x.R.values()].reduce((a,b)=>a+b,0);
  return `<div class="rs"><h4>${t}</h4><table class="rt"><thead><tr><th></th>${x.cols.map(c=>`<th>${esc(c)}</th>`).join('')}<th>Total</th></tr></thead><tbody>
   ${rr.map(r=>`<tr><td>${esc(r)}</td>${x.cols.map(c=>{const v=x.get(r,c);return `<td>${v?fmt(v):'0'}</td>`}).join('')}<td><b>${fmt(x.R.get(r))}</b><small>${pc(x.R.get(r),tot)}</small></td></tr>`).join('')}
   ${lim&&x.rr.length>lim?`<tr><td colspan="${x.cols.length+2}" class="note">… e mais ${x.rr.length-lim} linhas (completo no Excel)</td></tr>`:''}
   <tr class="tot"><td>Total</td>${x.cols.map(c=>`<td>${fmt(x.C.get(c))}</td>`).join('')}<td>${fmt(tot)}</td></tr></tbody></table></div>`}
function descFiltro(){const p=[];if(VATUAL)p.push('visão '+VATUAL);for(const [k,t] of FAC){const s=SEL[k];if(!s||!s.size)continue;const all=valoresFac(k);if(s.size>6&&s.size>all.length/2){const fora=all.filter(v=>!s.has(v));p.push(`${t}: todos menos ${fora.join(', ')||'nenhum'}`)}else p.push(`${t}: ${[...s].join(', ')}`)}
  if(PER.de||PER.ate)p.push(`período (${REFTX[PER.ref]}): ${dBR(PER.de)||'…'} a ${dBR(PER.ate)||'…'}`);if(Q)p.push('busca: '+QTXT);if(SELD)p.push('somente '+QD);return p.length?p.join(' · '):'Todas as unidades (sem filtro)'}
function leitura(){const n=F.length,L=contaNiv(F);const ac=new Map();for(const u of F)for(const a of u.al)ac.set(a[1],(ac.get(a[1])||0)+1);
  const t=[...ac].sort((a,b)=>b[1]-a[1]).slice(0,3).map(([c,q])=>`${AL[c][1]} (${fmt(q)})`);const ab=F.filter(u=>TRAT_ABERTA.has(tratSit(u))).length;
  return `<b>Leitura:</b> ${fmt(n)} unidades; ${fmt(L['CRÍTICO'])} críticas (${pc(L['CRÍTICO'],n,1)}), ${fmt(L.ALTO)} altas e ${fmt(L['MÉDIO'])} de atenção; conformidade de ${pc(L.CONFORME,n-L.INCONCLUSIVO,1)} nas unidades conferíveis. ${t.length?'Alertas mais frequentes: '+t.join('; ')+'. ':''}${fmt(ab)} pendências sem tratativa registrada.`}

  return imp?`<div class="pg">${p1}</div><div class="pg">${cab('Cruzamentos')}${p12}</div><div class="pg">${cab('Região e andar')}${p15}</div><div class="pg">${p2}</div>`:p1+p12+p15+'<div style="height:14px"></div>'+p2}

/* leitura de planilha -> linhas {coluna: texto} */
const snake=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
const p2=n=>String(n).padStart(2,'0');
function celula(c){if(!c)return null;
  if(c.t==='n'&&c.z&&XLSX.SSF.is_date(c.z)){const d=XLSX.SSF.parse_date_code(c.v);if(!d)return String(c.v);const s=`${d.y}-${p2(d.m)}-${p2(d.d)}`;return (d.H||d.M)?`${s} ${p2(d.H)}:${p2(d.M)}`:s}
  if(c.t==='d'&&c.v instanceof Date){const d=c.v;return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`}
  if(c.t==='b')return c.v?'SIM':'NÃO';if(c.t==='e')return null;
  const v=c.v;return v===undefined||v===null?null:String(v)}
async function leArquivo(fonte,nome,buf){
  const map=new Map((INFO.colunas[fonte]||[]).map(([c,r])=>[snake(r),c]));let head,linhas=[];
  if(/\.csv$/i.test(nome)){const txt=new TextDecoder('utf-8').decode(buf);const p=Papa.parse(txt,{skipEmptyLines:false});head=p.data[0];
    for(let i=1;i<p.data.length;i++){const r=p.data[i];if(!r.some(x=>String(x).trim()))continue;linhas.push({i:i+1,v:r})}
    const exato=new Map((INFO.colunas[fonte]||[]).map(([c,r])=>[String(r).trim(),c]));const idx=head.map(h=>exato.get(String(h).trim())||map.get(snake(h))),iLin=head.findIndex(h=>snake(h)==='linha_planilha');
    return {faltam:[...map.values()].filter(c=>!idx.includes(c)),rows:linhas.map(({i,v})=>{const o={linha:iLin>=0?parseInt(v[iLin])||i:i};idx.forEach((c,j)=>{if(c&&v[j]!==undefined&&String(v[j]).trim()!=='')o[c]=String(v[j])});return o})}}
  const wb=XLSX.read(buf,{type:'array',cellNF:true,cellDates:false,dense:false});
  const nomeAba=fonte==='erp118'&&wb.SheetNames.includes('Consulta1')?'Consulta1':fonte==='cadastro'&&wb.SheetNames.includes('BASE')?'BASE':wb.SheetNames[0];const ws=wb.Sheets[nomeAba];
  const rg=XLSX.utils.decode_range(ws['!ref']);head=[];for(let c=rg.s.c;c<=rg.e.c;c++){const x=ws[XLSX.utils.encode_cell({r:rg.s.r,c})];head.push(x?String(x.v):'')}
  const exato=new Map((INFO.colunas[fonte]||[]).map(([c,r])=>[String(r).trim(),c]));
  const usados=new Set(),idx=head.map(h=>{let c=exato.get(String(h).trim())||map.get(snake(h));if(c&&usados.has(c))c=map.has(snake(h)+'_2')&&!usados.has(c+'_2')?c+'_2':null;if(c)usados.add(c);return c});
  for(let r=rg.s.r+1;r<=rg.e.r;r++){const o={linha:r+1};let tem=false;for(let c=rg.s.c;c<=rg.e.c;c++){const col=idx[c-rg.s.c];if(!col)continue;const v=celula(ws[XLSX.utils.encode_cell({r,c})]);if(v!==null&&v.trim()!==''){o[col]=v;tem=true}}if(tem)linhas.push(o)}
  return {faltam:[...map.values()].filter(c=>!idx.includes(c)),rows:linhas,aba:nomeAba}}
async function sobe(fonte,nome,buf){
  load(true,'Lendo '+nome+'…','',2);await new Promise(r=>setTimeout(r,30));
  const L=await leArquivo(fonte,nome,buf);
  if(!L.rows.length)throw new Error('Nenhuma linha encontrada em '+nome);
  if(L.faltam.length>Math.max(3,(INFO.colunas[fonte]||[]).length/3))throw new Error(`O arquivo não parece ser da base ${fonte}: faltam as colunas ${L.faltam.slice(0,8).join(', ')}…`);
  const id=await rpc('tab_carga_iniciar',{p_fonte:fonte,p_arquivo:nome});const T=2000;let env=0;
  for(let i=0;i<L.rows.length;i+=T){await rpc('tab_carga_lote',{p_carga:id,p_linhas:L.rows.slice(i,i+T)});env+=Math.min(T,L.rows.length-i);
    load(true,'Enviando '+nome+'…',`${fmt(env)} de ${fmt(L.rows.length)} linhas`,100*env/L.rows.length)}
  await rpc('tab_carga_concluir',{p_carga:id});return {linhas:L.rows.length,faltam:L.faltam}}

  const cache=await idbGet('unidades');let cinfo=null;try{cinfo=JSON.parse(localStorage.getItem('tab_info')||'null')}catch(e){}
  if(cache&&cache.rows&&cinfo&&cinfo.eu&&SES&&cinfo.eu.email===SES.email){
    const ok=await Promise.race([pInfo.then(()=>1,()=>1),new Promise(r=>setTimeout(()=>r(0),2500))]);
    if(!ok){cedo=true;INFO=cinfo;cabecalho();estadoInicial(false);load(true,'Abrindo a cópia salva…','',60);await new Promise(r=>setTimeout(r,20));
      TRAT=new Map();mostra(cache.rows,cache.info||cinfo);load(false);sync('<b>Conectando ao banco…</b> o Supabase está lento; mostrando a cópia salva de '+esc((cache.info&&cache.info.reconstruido_em)||'—'))}}
  try{INFO=await pInfo}catch(e){load(false);
    if(/sem_permissao/.test(e.message)){await idbSet('unidades',null);localStorage.removeItem('tab_info');sync('');gate(msgErro(e));return}
    if(e.status===400||e.status===401){SES=null;sesSalva();sync('');gate('Sessão expirada. Entre de novo.');return}
    if(cedo){sync('Sem resposta do banco ('+esc(msgErro(e))+'). Mostrando a cópia salva. <a href="#" onclick="location.reload();return false">Tentar de novo</a>');return}
    toast(esc(msgErro(e)),1);return}
  try{localStorage.setItem('tab_info',JSON.stringify({eu:INFO.eu,versao:INFO.versao,total:INFO.total,corte_118:INFO.corte_118,reconstruido_em:INFO.reconstruido_em,cargas:INFO.cargas,colunas:INFO.colunas,depara:INFO.depara}))}catch(e){}
  cabecalho();
  if(cedo){carregaVisoes();if(INFO.total){sync('<b>Conectado.</b> Conferindo se há versão nova…');await recarrega()}return}
  await carregaVisoes();estadoInicial(true);
  if(!INFO.total){load(false);U=[];tudo();if(INFO.eu.papel==='admin')abreAdmin();else toast('O tabelão ainda não tem dados. Peça ao administrador para subir as bases.');return}
  await recarrega()}
function cabecalho(){
  const em=INFO.eu.email||'';$('#av').textContent=em.slice(0,1).toUpperCase();$('#whoN').textContent=em.split('@')[0];
  $('#whoD').innerHTML=`<b>${esc(em)}</b><br>${{admin:'Administrador',editor:'Editor (registra tratativas)',leitor:'Leitor (consulta)'}[INFO.eu.papel]||INFO.eu.papel} · versão ${VERSAO}<br>Tabelão montado em ${esc(INFO.reconstruido_em||'—')}`;
  $('#badm').style.display=INFO.eu.papel==='admin'?'':'none';
}
// abre: link compartilhado > visão padrão > último estado (sem banco ainda, a visão padrão fica de fora)
function estadoInicial(comVisoes){
  const lk=leLink(),pad=comVisoes?VIS.find(v=>v.padrao&&v.minha):null;let ini='ov';
  if(lk){aplicaEstado(lk);ini=lk.t||'un';VATUAL='link compartilhado';history.replaceState(null,'',location.pathname)}
  else if(pad){aplicaEstado(pad.filtros);ini=pad.filtros.t||'un';VATUAL=pad.nome;VID='v'+pad.id;VSNAP=snapEst()}
  else{try{const e=JSON.parse(localStorage.getItem('tab_estado')||'null');if(e){aplicaEstado(e);ini=e.t||'ov';VATUAL=e.v||null;VID=e.vid||null;VSNAP=e.vs||null}}catch(e){}}
  vsUI();aba(ini,true)}
let tq;$('#q').addEventListener('input',e=>{clearTimeout(tq);tq=setTimeout(()=>{QTXT=e.target.value.trim();Q=QTXT?[...new Set(ns(QTXT.replace(/[.\-\/](?=\d)/g,'')).split(' ').filter(Boolean))]:'';VATUAL=null;tudo()},180)});
document.querySelectorAll('#pqk button').forEach(b=>b.onclick=()=>setPer(b.dataset.d));
document.addEventListener('keydown',e=>{const tag=document.activeElement.tagName;const digitando=/INPUT|TEXTAREA|SELECT/.test(tag);
  if(e.key==='/'&&!digitando){e.preventDefault();$('#q').focus()}
  if(e.key==='Escape'){if($('#mb').classList.contains('on'))fechaMd();else fechaDr();$('#menu').classList.remove('on')}
  if($('#dr').classList.contains('on')&&!digitando&&!$('#mb').classList.contains('on')){if(e.key==='ArrowDown'||e.key==='j'){e.preventDefault();navDr(1)}if(e.key==='ArrowUp'||e.key==='k'){e.preventDefault();navDr(-1)}}});
document.addEventListener('click',()=>$('#menu').classList.remove('on'));
$('#gs').addEventListener('keydown',e=>{if(e.key==='Enter')entra()});
$('#tb').addEventListener('scroll',()=>requestAnimationFrame(desenha));window.addEventListener('resize',()=>desenha());
// filtro por "somente" (novas/resolvidas desde a última atualização) entra no passo de filtro
const _base=basePassa;basePassa=u=>(!SELD||SELD.has(u.ch))&&_base(u);
const _limpa=limpa;limpa=()=>{SELD=null;QD=null;_limpa()};
window.addEventListener('load',async()=>{cab();aba('ov',true);let s=null;try{s=JSON.parse(localStorage.getItem('tab_sb')||'null')}catch(e){}
  if(s&&s.refresh){SES={email:s.email,refresh:s.refresh};try{await inicia()}catch(e){SES=null;sesSalva();load(false);gate('Sessão expirada. Entre de novo.')}}else gate()});
</script>
