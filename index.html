<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tabelão Vinculado · Anapro × 118 × Movfin</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" defer></script>
<style>
:root{--vinho:#5C0A10;--vermelho:#C41420;--rosa:#F8E8E9;--rl:#EFD2D4;--tinta:#1A1416;--graf:#6B6065;--neutro:#EDE9EA;--ok:#1F7A5C;--alto:#B4521E;--medio:#B88A00;--baixo:#6B6065;
  --bg:#F6F4F4;--card:#fff;--line:#E6E1E2;--azul:#1F4E8C}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;font-size:13px;color:var(--tinta);background:var(--bg);height:100vh;overflow:hidden}
button,input,select{font:inherit}
.hd{display:flex;align-items:center;gap:14px;height:54px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line)}
.hd img{height:26px}.hd .t{font-family:'Space Grotesk';font-weight:700;font-size:17px;color:var(--vinho);letter-spacing:-.02em}
.hd .t small{font-family:Inter;font-weight:500;font-size:11.5px;color:var(--graf);margin-left:8px;letter-spacing:0}
.hd .sp{flex:1}.hd .who{font-size:12px;color:var(--graf);text-align:right;line-height:1.25}
.btn{border:1px solid var(--vinho);background:var(--vinho);color:#fff;border-radius:7px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:12.5px;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}.btn:disabled{opacity:.5;cursor:default}
.btn.g{background:#fff;color:var(--vinho)}.btn.r{background:var(--vermelho);border-color:var(--vermelho)}.btn.sm{padding:4px 9px;font-size:12px}
.app{display:grid;grid-template-columns:270px 1fr;height:calc(100vh - 54px)}
.side{background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:12px 12px 30px}
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.srch{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#FBFAFA}
.srch:focus{outline:2px solid var(--rl);border-color:var(--vinho)}
.fac{margin-top:12px;border-top:1px solid var(--line);padding-top:9px}
.fac h4{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--graf);font-weight:600;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.fac h4 a{font-size:10.5px;color:var(--vermelho);text-transform:none;letter-spacing:0;cursor:pointer}
.fac .ops{margin-top:6px;max-height:210px;overflow-y:auto}
.fac.fech .ops,.fac.fech .fsr,.fac.fech .fbt{display:none}
.fbt{display:flex;gap:10px;margin-top:5px}.fbt a{font-size:11px;color:var(--vinho);cursor:pointer;text-decoration:underline;text-decoration-color:var(--rl)}.fbt a:hover{color:var(--vermelho)}
.op{display:flex;align-items:center;gap:7px;padding:3px 4px;border-radius:5px;cursor:pointer;font-size:12.3px;line-height:1.25}
.op:hover{background:var(--rosa)}.op input{accent-color:var(--vinho)}
.op span.l{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.op span.n{color:var(--graf);font-variant-numeric:tabular-nums;font-size:11.5px}
.op.z{opacity:.45}
.fsr{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:5px;padding:4px 7px;font-size:12px}
.kp{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:12px 16px 4px}
.k{background:#fff;border:1px solid var(--line);border-top:3px solid var(--vinho);border-radius:8px;padding:9px 11px;cursor:pointer}
.k.c{border-top-color:var(--vermelho)}.k.a{border-top-color:var(--alto)}.k.ok{border-top-color:var(--ok)}
.k b{display:block;font-family:'Space Grotesk';font-size:21px;color:var(--vinho);font-variant-numeric:tabular-nums;line-height:1.1}
.k.c b{color:var(--vermelho)}.k b small{font-family:Inter;font-size:11px;color:var(--graf);font-weight:500;margin-left:5px}
.k span{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--graf);font-weight:600}
.bar{display:flex;align-items:center;gap:8px;padding:8px 16px;flex-wrap:wrap}
.chips{display:flex;gap:5px;flex-wrap:wrap;flex:1;min-width:0}
.chip{background:var(--rosa);color:var(--vinho);border-radius:12px;padding:3px 9px;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.chip:hover{background:var(--rl)}.cnt{font-size:12px;color:var(--graf);white-space:nowrap}
.tw{flex:1;margin:0 16px 12px;background:#fff;border:1px solid var(--line);border-radius:9px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.th,.tr{display:grid;grid-template-columns:var(--gc);align-items:center}
.th{background:#FBFAFA;border-bottom:1px solid var(--line);font-size:10.3px;letter-spacing:.06em;text-transform:uppercase;color:var(--graf);font-weight:600}
.th .grp{grid-column:span var(--s);padding:5px 8px 2px;border-bottom:2px solid;font-size:10px;letter-spacing:.1em}
.th .h{padding:5px 8px 6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.th .h:hover{color:var(--vinho)}
.th .h.s::after{content:" ▾"}.th .h.s.asc::after{content:" ▴"}
.g-a{border-color:#C98088!important;color:var(--vinho)}.g-e{border-color:var(--vinho)!important;color:var(--vinho)}.g-m{border-color:var(--azul)!important;color:var(--azul)}.g-c{border-color:var(--graf)!important}
.tb{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.tr{height:36px;border-bottom:1px solid #F1EDEE;cursor:pointer;position:absolute;left:0;right:0}
.tr:hover{background:#FCF6F6}.tr.sel{background:var(--rosa)}
.tr>div{padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.2px}
.tr .emp{font-weight:600}.tr .un{font-family:'Space Grotesk';font-weight:600;font-variant-numeric:tabular-nums}
.sub{display:block;font-size:10.8px;color:var(--graf);overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.tr>div{line-height:1.25}
.pl{display:inline-block;padding:1px 7px;border-radius:9px;font-size:10.8px;font-weight:600;white-space:nowrap;background:var(--neutro);color:var(--graf)}
.pl.v{background:#E8F1EC;color:var(--ok)}.pl.d{background:#FCE7E8;color:var(--vermelho)}.pl.p{background:#FFF4D6;color:#8A6500}.pl.b{background:#EEE;color:#555}.pl.x{background:#E7EEF7;color:var(--azul)}
.cr{display:inline-block;padding:1px 7px;border-radius:9px;font-size:10.5px;font-weight:700;letter-spacing:.03em}
.cr.CRÍTICO{background:var(--vermelho);color:#fff}.cr.ALTO{background:var(--alto);color:#fff}.cr.MÉDIO{background:#F3D27A;color:#5C4300}.cr.CONFORME{background:#E8F1EC;color:var(--ok)}.cr.INCONCLUSIVO{background:var(--neutro);color:var(--graf)}
.cl{font-weight:700;font-size:11px}.cl.MESMO{color:var(--ok)}.cl.PROVÁVEL{color:#8A6500}.cl.DIFERENTE{color:var(--vermelho)}.cl.UM,.cl.SEM{color:var(--graf);font-weight:500}.cl.GENÉRICO{color:var(--graf)}
.vz{padding:40px;text-align:center;color:var(--graf)}
/* drawer */
.dr{position:fixed;top:0;right:0;width:min(760px,92vw);height:100vh;background:#fff;box-shadow:-8px 0 30px rgba(26,20,22,.18);transform:translateX(105%);transition:transform .18s;z-index:20;display:flex;flex-direction:column}
.dr.on{transform:none}.drh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
.drh h2{font-family:'Space Grotesk';color:var(--vinho);font-size:19px;letter-spacing:-.02em}.drh p{color:var(--graf);font-size:12px;margin-top:2px}
.drb{flex:1;overflow-y:auto;padding:14px 18px 40px}
.x{margin-left:auto;border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--graf)}
.al{border-radius:8px;padding:8px 11px;margin-bottom:6px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.al.CRÍTICO{background:#FCE7E8}.al.ALTO{background:#FBEDE3}.al.MÉDIO{background:#FFF6DB}
.cad{display:flex;flex-wrap:wrap;gap:6px 16px;background:#FBFAFA;border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-top:10px}
.cad div{display:flex;flex-direction:column;font-size:12px}.cad span{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--graf)}.cad .fora{color:var(--vermelho);font-weight:600;justify-content:center}
.c3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.sc{border:1px solid var(--line);border-radius:9px;padding:10px 11px;border-top:3px solid}
.sc h5{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.sc dl{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:12px}.sc dt{color:var(--graf)}.sc dd{font-weight:500;overflow-wrap:anywhere}
.cmp{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin:10px 0}
.cmp h5{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--graf);margin-bottom:6px}
.cmp table{width:100%;border-collapse:collapse;font-size:12.3px}.cmp td{padding:4px 4px;border-bottom:1px solid #F1EDEE}
.raw{margin-top:14px}.raw summary{cursor:pointer;font-weight:600;color:var(--vinho);padding:6px 0}
.kv{display:grid;grid-template-columns:200px 1fr;gap:1px 10px;font-size:11.8px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;margin:6px 0}
.kv div:nth-child(odd){color:var(--graf)}.kv div{overflow-wrap:anywhere;padding:1px 0}
.kv h6{grid-column:1/-1;font-size:11px;color:var(--vinho);margin-bottom:3px}
/* modal */
.mb{position:fixed;inset:0;background:rgba(26,20,22,.42);z-index:30;display:none;align-items:center;justify-content:center}
.mb.on{display:flex}.md{background:#fff;border-radius:12px;width:min(1180px,95vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.mdh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.mdh h3{font-family:'Space Grotesk';color:var(--vinho);font-size:18px}.mdb{overflow-y:auto;padding:16px 18px 24px}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rt{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.rt th{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--graf);font-weight:600;text-align:right;padding:5px 6px;border-bottom:2px solid var(--vinho)}
.rt th:first-child,.rt td:first-child{text-align:left}
.rt td{padding:4px 6px;border-bottom:1px solid #F1EDEE;text-align:right}.rt td small{color:var(--graf);margin-left:4px;font-size:10px}
.rt tr.tot td{font-weight:700;background:var(--rosa)}
.rs h4{font-family:'Space Grotesk';color:var(--vinho);font-size:14px;margin:4px 0 6px;border-left:3px solid var(--vinho);padding-left:7px}
.rk{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.note{font-size:11.5px;color:var(--graf);margin-top:6px;line-height:1.45}
/* login */
.gate{position:fixed;inset:0;background:linear-gradient(135deg,#5C0A10,#2B0508);display:none;align-items:center;justify-content:center;z-index:50}
.gate.on{display:flex}.gbox{background:#fff;border-radius:14px;padding:26px 28px;width:360px}
.gbox img{height:30px}.gbox h1{font-family:'Space Grotesk';color:var(--vinho);font-size:22px;margin:14px 0 4px}
.gbox p{color:var(--graf);font-size:12.5px;margin-bottom:14px}.gbox input{width:100%;margin-bottom:9px;border:1px solid var(--line);border-radius:7px;padding:10px}
.gbox .btn{width:100%;padding:10px}.gm{color:var(--vermelho);font-size:12px;min-height:16px;margin-top:8px}
.ld{position:fixed;inset:0;background:rgba(255,255,255,.82);z-index:40;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.ld.on{display:flex}.ld b{font-family:'Space Grotesk';color:var(--vinho);font-size:16px}.ld .pb{width:320px;height:6px;background:var(--neutro);border-radius:3px;overflow:hidden}
.ld .pb i{display:block;height:100%;background:var(--vinho);width:0;transition:width .2s}.ld span{color:var(--graf);font-size:12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-size:12.5px;display:none;max-width:80vw}
.toast.on{display:block}.toast.err{background:var(--vermelho)}
/* admin */
.up{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.upc{border:1px solid var(--line);border-radius:10px;padding:12px}
.upc h5{font-family:'Space Grotesk';color:var(--vinho);font-size:15px}.upc p{font-size:11.5px;color:var(--graf);margin:3px 0 8px;min-height:30px}
.upc input[type=file]{width:100%;font-size:11.5px;margin-bottom:8px}
.frm{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.frm input,.frm select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;flex:1;min-width:160px}
/* impressão do relatório */
#prt{display:none}
@media print{
  @page{size:A4 landscape;margin:9mm}
  body{height:auto;overflow:visible;background:#fff}
  body>*:not(#prt){display:none!important}
  #prt{display:block}
  #prt .rt{font-size:9pt}#prt .rt td,#prt .rt th{padding:2.5px 5px}
  #prt .pg{page-break-after:always}#prt .pg:last-child{page-break-after:auto}
  #prt .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--vinho);padding-bottom:5px;margin-bottom:9px}
  #prt .ph img{height:22px}#prt .ph h2{font-family:'Space Grotesk';color:var(--vinho);font-size:16pt}
  #prt .ph div{text-align:right;font-size:8pt;color:var(--graf)}
  #prt .rk{grid-template-columns:repeat(5,1fr)}#prt .k{padding:6px 8px}#prt .k b{font-size:15pt}
  #prt .rg{gap:10px}#prt .note{font-size:8pt}
  #prt .rs{break-inside:avoid}
}
</style>
</head>
<body>
<header class="hd">
  <img src="logo.png" alt="Metrocasa">
  <div class="t">Tabelão Vinculado<small>Anapro × ERP 118 × Movimentação Financeira</small></div>
  <div class="sp"></div>
  <button class="btn g" onclick="abreRelatorio()">Relatório da seleção</button>
  <button class="btn g" onclick="exporta('xlsx')">Exportar Excel</button>
  <button class="btn g" id="badm" onclick="abreAdmin()" style="display:none">Bases e acessos</button>
  <div class="who" id="who"></div>
  <button class="btn g sm" onclick="sair()">Sair</button>
</header>
<div class="app">
  <aside class="side">
    <input class="srch" id="q" placeholder="Buscar unidade, cliente, CPF, contrato…  ( / )" autocomplete="off">
    <div id="facs"></div>
  </aside>
  <section class="main">
    <div class="kp" id="kp"></div>
    <div class="bar"><div class="chips" id="chips"></div><span class="cnt" id="cnt"></span><button class="btn g sm" onclick="limpa()">Limpar filtros</button></div>
    <div class="tw"><div class="th" id="th"></div><div class="tb" id="tb"><div id="sp"></div></div></div>
  </section>
</div>
<div class="dr" id="dr"><div class="drh"><div><h2 id="drt"></h2><p id="drs"></p></div><button class="x" onclick="fechaDr()">×</button></div><div class="drb" id="drb"></div></div>
<div class="mb" id="mb" onclick="if(event.target===this)fechaMd()"><div class="md"><div class="mdh"><h3 id="mdt"></h3><div style="flex:1"></div><div id="mda"></div><button class="x" onclick="fechaMd()">×</button></div><div class="mdb" id="mdb"></div></div></div>
<div class="gate" id="gate"><div class="gbox"><img src="logo.png" alt=""><h1>Tabelão Vinculado</h1><p>Entre com o mesmo login do Acompanhamento Comercial e do painel de Recompras.</p>
  <input id="ge" type="email" placeholder="e-mail" autocomplete="username"><input id="gs" type="password" placeholder="senha" autocomplete="current-password">
  <button class="btn" id="gg" onclick="entra()">Entrar</button><div class="gm" id="gm"></div></div></div>
<div class="ld" id="ld"><b id="ldt">Carregando…</b><div class="pb"><i id="ldp"></i></div><span id="lds"></span></div>
<div class="toast" id="toast"></div>
<div id="prt"></div>
<script>
const VERSAO='1.2.1';
const SB={url:'https://jspfqktrbimrarimpzgh.supabase.co',key:'sb_publishable_v5q-FJsZbsufq31dqi3zlA_ddzJQ_f-'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('pt-BR');
const pc=(a,b,d=0)=>b?(100*a/b).toFixed(d).replace('.',',')+'%':'—';
function toast(m,err){const t=$('#toast');t.innerHTML=m;t.className='toast on'+(err?' err':'');clearTimeout(t._h);t._h=setTimeout(()=>t.className='toast',err?7000:3500)}
function load(on,t,s,p){$('#ld').classList.toggle('on',!!on);if(t)$('#ldt').textContent=t;$('#lds').textContent=s||'';$('#ldp').style.width=(p==null?0:p)+'%'}

/* ------------------------------------------------ Supabase */
let SES=null,INFO=null;
const sbH=t=>({'Content-Type':'application/json',apikey:SB.key,...(t?{Authorization:'Bearer '+t}:{})});
async function sbCall(url,opt){const r=await fetch(url,opt);const tx=await r.text();let j=null;try{j=tx?JSON.parse(tx):null}catch(e){}
  if(!r.ok){const e=new Error((j&&(j.message||j.error_description||j.msg||j.error))||('HTTP '+r.status));e.status=r.status;throw e}return j}
const sesSalva=()=>{try{SES?localStorage.setItem('tab_sb',JSON.stringify({email:SES.email,refresh:SES.refresh})):localStorage.removeItem('tab_sb')}catch(e){}};
async function sbRenova(){const j=await sbCall(SB.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:sbH(),body:JSON.stringify({refresh_token:SES.refresh})});SES.access=j.access_token;SES.refresh=j.refresh_token;sesSalva()}
async function rpc(fn,args={}){if(!SES.access)await sbRenova();
  const f=()=>sbCall(SB.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:sbH(SES.access),body:JSON.stringify(args)});
  try{return await f()}catch(e){if(e.status===401){await sbRenova();return f()}throw e}}
const msgErro=e=>/sem_permissao/.test(e.message)?'Seu login ainda não tem acesso ao Tabelão. Peça ao administrador.':/somente_admin/.test(e.message)?'Só o administrador pode fazer isso.':/sem_login_supabase/.test(e.message)?'Esse e-mail não tem login no Supabase (Authentication → Users → Add user).':/nao_pode_rebaixar/.test(e.message)?'Você não pode tirar o seu próprio acesso de admin.':/Invalid login|invalid_grant/i.test(e.message)?'E-mail ou senha incorretos.':/Failed to fetch|NetworkError/i.test(e.message)?'Sem conexão com o banco.':/statement timeout|canceling statement/i.test(e.message)?'O banco demorou demais para responder. Tente de novo.':e.message;
function gate(m){$('#gate').classList.add('on');try{$('#ge').value=localStorage.getItem('tab_email')||''}catch(e){}$('#gm').textContent=m||'';setTimeout(()=>($('#ge').value?$('#gs'):$('#ge')).focus(),60)}
async function entra(){const em=$('#ge').value.trim(),se=$('#gs').value;if(!em||!se){$('#gm').textContent='Informe e-mail e senha.';return}
  $('#gg').disabled=true;$('#gm').textContent='';
  try{const j=await sbCall(SB.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:sbH(),body:JSON.stringify({email:em,password:se})});
    SES={email:em,access:j.access_token,refresh:j.refresh_token};sesSalva();try{localStorage.setItem('tab_email',em)}catch(e){}
    $('#gate').classList.remove('on');$('#gs').value='';await inicia()}
  catch(e){SES=null;sesSalva();$('#gm').textContent=msgErro(e)}finally{$('#gg').disabled=false}}
function sair(){const s=SES;SES=null;sesSalva();if(s&&s.access)fetch(SB.url+'/auth/v1/logout',{method:'POST',headers:sbH(s.access)}).catch(()=>{});location.reload()}

/* ------------------------------------------------ cache local (IndexedDB) */
const idb=()=>new Promise((ok,er)=>{const r=indexedDB.open('tabelao',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>er(r.error)});
async function idbGet(k){try{const d=await idb();return await new Promise(ok=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})}catch(e){return null}}
async function idbSet(k,v){try{const d=await idb();await new Promise(ok=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=ok;t.onerror=ok})}catch(e){}}

async function carregaUnidades(){
  const cache=await idbGet('unidades');
  if(cache&&cache.versao===INFO.versao&&cache.rows)return cache.rows;
  const tot=INFO.total||0,P=5000,pags=Math.max(1,Math.ceil(tot/P));let rows=[],feitas=0;
  load(true,'Baixando o tabelão do banco…',`${fmt(tot)} unidades`,0);
  const tarefas=[...Array(pags).keys()];const res=new Array(pags);
  async function w(){while(tarefas.length){const i=tarefas.shift();res[i]=(await rpc('tab_unidades',{p_offset:i*P,p_limit:P})).rows;feitas++;load(true,'Baixando o tabelão do banco…',`${fmt(Math.min(feitas*P,tot))} de ${fmt(tot)} unidades`,100*feitas/pags)}}
  await Promise.all([w(),w(),w()]);rows=res.flat();
  await idbSet('unidades',{versao:INFO.versao,rows});return rows}

/* ------------------------------------------------ comparação de clientes */
const STOP=new Set(['DE','DA','DO','DAS','DOS','E']);
const nm=s=>String(s||'').replace(/�/g,'?').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z? ]/g,' ').replace(/\s+/g,' ').trim();
const toks=s=>nm(s).split(' ').filter(t=>t.length>=2&&!STOP.has(t));
const teq=(a,b)=>a===b||(a.length===b.length&&[...a].every((c,i)=>c===b[i]||c==='?'||b[i]==='?'));
const RANK={IGUAL:6,'IGUAL (grafia)':5,'NOME AMPLIADO':4,'NOME ALTERADO':3,'SÓ 1º NOME':1,'DIFERENTE':0};
function lev1(a,b){if(a===b)return true;if(Math.min(a.length,b.length)<4||Math.abs(a.length-b.length)>1)return false;
  let i=0,j=0,d=0;while(i<a.length&&j<b.length){if(a[i]===b[j]||a[i]==='?'||b[j]==='?'){i++;j++;continue}if(++d>1)return false;
    if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}}return d+(a.length-i)+(b.length-j)<=1}
const feq=(a,b)=>teq(a,b)||lev1(a,b);
/* compara duas pessoas pelo nome:
   IGUAL · IGUAL (grafia) = 1 letra de diferença · NOME AMPLIADO = um nome contém o outro inteiro (ex.: casou e ganhou "SILVA")
   NOME ALTERADO = mesmo 1º nome e mais um nome em comum, com sobrenome trocado · SÓ 1º NOME · DIFERENTE */
function cmpPar(x,y){const A=toks(x),B=toks(y);if(!A.length||!B.length)return null;
  const exa=A.filter(a=>B.some(b=>teq(a,b))).length;
  if(exa===A.length&&exa===B.length)return 'IGUAL';
  const ab=A.filter(a=>B.some(b=>feq(a,b))).length,ba=B.filter(b=>A.some(a=>feq(a,b))).length,pri=feq(A[0],B[0]);
  if(ab===A.length&&ba===B.length)return 'IGUAL (grafia)';
  if(pri&&(ab===A.length||ba===B.length)&&Math.min(A.length,B.length)>=2)return 'NOME AMPLIADO';
  if(pri&&ab>=2)return 'NOME ALTERADO';
  if(!pri&&ab>=2&&ab>=Math.min(A.length,B.length)-1)return 'NOME ALTERADO';
  if(pri)return 'SÓ 1º NOME';return 'DIFERENTE'}
const partes=s=>String(s||'').split(/\s*[,|;]\s*/).map(x=>x.trim()).filter(Boolean);
function cmpNomes(x,y){let best=null;for(const a of partes(x))for(const b of partes(y)){const r=cmpPar(a,b);if(r&&(best===null||RANK[r]>RANK[best]))best=r}return best}
/* compara com o comprador principal e com o 2º comprador do movfin; devolve o melhor e se veio do 2º */
function cmpPessoa(x,princ,seg){if(seg&&bom(cmpNomes(seg,princ)))seg=null;const a=cmpNomes(x,princ),b=seg?cmpNomes(x,seg):null;
  if(b&&(a===null||RANK[b]>RANK[a])&&RANK[b]>=4)return {r:b,seg:true};return {r:a,seg:false}}
const bom=r=>r&&RANK[r]>=4;   // igual, grafia ou nome ampliado
const ns=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();
const generico=s=>/CLIENTE PADR/i.test(nm(s));

/* ------------------------------------------------ andar, bloco e final a partir do código da unidade */
function posicao(un,tipo){const r={bloco:'',andar:'—',andarN:999,final:''};let m=String(un||'').match(/^([^-]+)-(.+)$/);
  if(m){r.bloco=m[1]==='U'?'Torre única':'Bloco '+m[1];const x=m[2];
    if((m=x.match(/^(\d{2})(\d{2})$/))){const n=+m[1];r.andarN=n;r.andar=n===0?'Térreo':n+'º andar';r.final=m[2]}
    else if((m=x.match(/^(\d)S(\d{2})$/))){r.andarN=+m[1]?-(+m[1]):-0.5;r.andar=+m[1]?m[1]+'º subsolo':'Subsolo';r.final=m[2]}
    else if((m=x.match(/^0S(\d{2})$/))){r.andarN=-0.5;r.andar='Subsolo';r.final=m[1]}
    else if(/^V|^M0/.test(x)){r.andar='Vaga';r.andarN=900}
    else if(/^S0/.test(x)){r.andar='Subsolo';r.andarN=-0.5}
    else if(/^LO/.test(x)){r.andar='Loja';r.andarN=901}}
  else if((m=String(un).match(/^(\d{1,2})(\d{2})$/))){const n=+m[1];r.andarN=n;r.andar=n===0?'Térreo':n+'º andar';r.final=m[2]}
  else if(/VAGA/i.test(un)){r.andar='Vaga';r.andarN=900}else if(/LOJA/i.test(un)){r.andar='Loja';r.andarN=901}
  if(/VAGA/i.test(tipo||''))r.andar='Vaga',r.andarN=900;if(/LOJA/i.test(tipo||''))r.andar='Loja',r.andarN=901;
  return r}
const anoEntrega=s=>{const m=String(s||'').match(/(\d{4})/);return m?m[1]:'—'};

/* ------------------------------------------------ derivação: cliente e alertas */
const ORD={'CRÍTICO':0,'ALTO':1,'MÉDIO':2,'CONFORME':3,'INCONCLUSIVO':4};
function deriva(r){
  const u={};COLS.forEach((c,i)=>u[c]=r[i]);for(const c of ['a_cliente','e_cliente','m_cliente','m_segundo'])if(u[c]&&/^[-–\s.]*$/.test(u[c]))u[c]=null;
  u.ch=u.emp+' · '+u.un;Object.assign(u,{pos:posicao(u.un,u.c_tipo)});u.andar=u.pos.andar;u.blocoT=u.pos.bloco;u.final=u.pos.final;
  u.tip=u.c_especial||u.c_tipologia||u.a_tipologia||'—';u.noCad=u.c_n?'Sim':'Não (fora do cadastro)';ANDN[u.andar]=u.pos.andarN;
  u.ag=u.a_grupo||'— sem Anapro';u.es=u.e_situacao||'— sem 118';u.ms=u.m_situacao||'— sem movfin';
  // clientes "atuais" de cada sistema
  const cA=u.a_cliente&&/VENDIDA|EM PROCESSO/.test(u.a_grupo||'')?u.a_cliente:null;
  const cE=u.e_travada?u.e_cliente:null;
  const cM=u.m_cliente&&u.m_situacao&&u.m_situacao!=='DISTRATO'?u.m_cliente:null;
  const p={},mot=[];
  // Anapro × 118 (o 118 só traz o 1º comprador; o Anapro pode trazer o 2º)
  if(cA&&cE){if(generico(cA))p.ae='GENÉRICO';else{const r=cmpNomes(cA,cE);
    if(!bom(r)&&u.m_segundo&&!bom(cmpNomes(u.m_segundo,u.m_cliente))&&bom(cmpNomes(cA,u.m_segundo))&&bom(cmpNomes(cE,u.m_cliente)))p.ae='OUTRO COMPRADOR (Anapro = 2º comprador do movfin)';else p.ae=r}}
  // 118 × movfin: CPF decide
  const cpf=c=>{const d=String(c||'').replace(/\D/g,'');return d.length===10||d.length===9?d.padStart(11,'0'):d.length===11?d:null};
  const ce=cpf(u.e_cpf),cm=cpf(u.m_cpf);
  if(cE&&cM){if(ce&&cm){const r=cmpNomes(cE,cM);
      if(ce===cm)p.em=/^IGUAL/.test(r||'')?'MESMO CPF':'MESMO CPF · nome mudou ('+(r||'?').toLowerCase()+')';
      else if(/^IGUAL/.test(r||''))p.em='CPF DIFERENTE · mesmo nome';
      else if(u.m_segundo&&bom(cmpNomes(cE,u.m_segundo)))p.em='CPF DIFERENTE · 118 = 2º comprador do movfin';
      else p.em='CPF DIFERENTE'}
    else{const x=cmpPessoa(cE,cM,u.m_segundo);p.em=x.seg?x.r+' · 2º comprador':x.r}}
  // Anapro × movfin (nome do Anapro contra o 1º e o 2º comprador)
  if(cA&&cM){if(generico(cA))p.am='GENÉRICO';else{const x=cmpPessoa(cA,cM,u.m_segundo);p.am=x.seg?x.r+' · 2º comprador':x.r}}
  u.cmp=p;const v=Object.values(p).filter(x=>x&&x!=='GENÉRICO');
  const tem=re=>v.some(x=>re.test(x));
  const n=[cA&&!generico(cA),cE,cM].filter(Boolean).length;
  if(n===0)u.cli=generico(cA||'')?'GENÉRICO no Anapro':'SEM CLIENTE ATUAL';
  else if(n===1)u.cli='UM SISTEMA SÓ';
  else if(tem(/^DIFERENTE|^CPF DIFERENTE$/))u.cli='DIFERENTE';
  else if(tem(/CPF DIFERENTE · mesmo nome/))u.cli='MESMO NOME, CPF DIFERENTE';
  else if(tem(/^SÓ 1º NOME/))u.cli='PROVÁVEL MESMO (só o 1º nome bate)';
  else if(tem(/NOME AMPLIADO|NOME ALTERADO|nome mudou/))u.cli=tem(/^MESMO CPF/)?'MESMO CLIENTE · nome mudou (CPF confirma)':'PROVÁVEL MESMO · nome mudou (casamento?)';
  else if(tem(/2º comprador|OUTRO COMPRADOR/))u.cli='MESMO CONTRATO · 2º comprador';
  else if(v.length)u.cli='MESMO CLIENTE';else u.cli='GENÉRICO no Anapro';
  u.cliNome=cE||cM||cA||u.e_cliente||u.m_cliente||u.a_cliente||'';
  // alertas
  const al=[],ad=(n,t)=>al.push([n,t]);const g=u.a_grupo||'';
  const aDt=(()=>{const m=String(u.a_data_venda||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?m[3]+'-'+m[2]+'-'+m[1]:null})();
  if(u.e_travada&&/DISPONÍVEL/.test(g))ad('CRÍTICO','Travada no 118 e DISPONÍVEL para venda no Anapro');
  if(u.e_travada&&!u.a_n)ad('CRÍTICO','Ativa e travada no 118, inexistente no Anapro');
  if((u.e_n_vig||0)>1)ad('CRÍTICO',`${u.e_n_vig} vendas vigentes no 118 para a mesma unidade`);
  if(u.e_travada&&/BLOQUEADA|PERMUTA/.test(g))ad('ALTO',`Travada no 118, mas "${u.a_status}" no Anapro`);
  if(/VENDIDA/.test(g)&&!u.e_travada){if(aDt&&CORTE&&aDt>CORTE)ad('MÉDIO','Vendida no Anapro depois do corte do 118 (confirmar com 118 novo)');else ad('ALTO',u.e_n_reg?'Vendida no Anapro, mas o 118 só tem vendas canceladas':'Vendida no Anapro e sem nenhuma venda no 118')}
  if(u.e_n_reg&&!u.e_travada&&!u.a_n)ad('ALTO','Unidade do 118 (vendas canceladas) inexistente no Anapro');
  if(u.m_situacao&&u.m_situacao!=='DISTRATO'&&u.e_n_reg&&!u.e_travada)ad('ALTO','Repasse ativo no movfin, mas a venda está cancelada no 118');
  if(u.m_situacao==='DISTRATO'&&u.m_via_contrato&&/VENDA VIGENTE|QUITADA/.test(u.e_situacao||''))ad('ALTO','Distrato no movfin, mas a mesma venda segue vigente no 118');
  if(u.e_travada&&/EM PROCESSO/.test(g))ad('MÉDIO','Travada no 118 e em aprovação/negociação no Anapro');
  if(!u.e_travada&&(u.e_n_vig||0)>0)ad('MÉDIO','Venda mais recente cancelada no 118, mas há venda anterior ainda não cancelada');
  if(u.cli==='DIFERENTE')ad('MÉDIO','Cliente diferente entre os sistemas');
  if(u.e_travada&&u.e_situacao==='VENDA VIGENTE'&&u.e_tipo_venda==='CEF'&&!u.m_n&&u.e_status_escritura!=='PRE-VENDA')ad('MÉDIO','Venda CEF vigente no 118 sem registro no movfin');
  if(u.cli==='MESMO NOME, CPF DIFERENTE')ad('MÉDIO','Mesmo nome, mas CPF diferente entre 118 e movfin');
  al.sort((a,b)=>ORD[a[0]]-ORD[b[0]]);u.al=al;u.crit=al.length?al[0][0]:(u.presenca==='Anapro'?'INCONCLUSIVO':'CONFORME');
  u.alTxt=al.map(a=>a[1]);
  u.txt=' '+ns([u.emp,u.un,u.un.replace(/-/g,''),u.a_cliente,u.e_cliente,u.m_cliente,u.m_segundo,u.e_num_venda,u.e_contrato,u.m_contrato_crm,u.m_contrato_fin,u.e_cpf,u.m_cpf].join(' '))+' ';
  return u}

/* ------------------------------------------------ filtros */
const FAC=[
 ['crit','Criticidade',u=>u.crit,true],
 ['tip','Tipologia',u=>u.tip,false],
 ['andar','Andar',u=>u.andar,false,(a,b)=>(ANDN[a]??999)-(ANDN[b]??999)],
 ['bloco','Bloco',u=>u.blocoT||'—',false],
 ['cat','Categoria de uso',u=>u.c_cat_uso||'—',false],
 ['reg','Região',u=>u.c_regiao||'—',false],
 ['cls','Classificação',u=>u.c_classif||'—',false],
 ['ent','Ano de entrega',u=>anoEntrega(u.c_entrega),false,(a,b)=>String(a).localeCompare(String(b))],
 ['tu','Tipo de unidade',u=>u.c_tipo||'—',false],
 ['cad','No cadastro de empreendimentos?',u=>u.noCad,false],
 ['alerta','Alerta',u=>u.alTxt.length?u.alTxt:['(sem alerta)'],false],
 ['emp','Empreendimento',u=>u.emp,false],
 ['pres','Presença nos sistemas',u=>u.presenca,false],
 ['ag','Status Anapro',u=>u.ag,true],
 ['as','Status Anapro (original)',u=>u.a_status||'— sem Anapro',false],
 ['es','Situação 118',u=>u.es,true],
 ['ef','Finalidade 118',u=>u.e_finalidade||'—',true],
 ['ee','Status escritura 118',u=>u.e_status_escritura||'—',false],
 ['ms','Situação movfin',u=>u.ms,true],
 ['mf','Fase movfin',u=>u.m_fase||'—',false],
 ['mt','Síntese movfin',u=>u.m_sintese||'—',false],
 ['cli','Mesmo cliente?',u=>u.cli,true],
 ['tv','Tipo de venda 118',u=>u.e_tipo_venda||'—',false],
 ['car','Carteira 118',u=>u.e_carteira||'—',false],
];
const SEL={};let Q='',ORDEM={c:'emp',asc:true};const ANDN={};
function passa(u,ign){for(const [k,,fn] of FAC){if(k===ign)continue;const s=SEL[k];if(!s||!s.size)continue;const v=fn(u);if(Array.isArray(v)?!v.some(x=>s.has(x)):!s.has(v))return false}
  if(Q){for(const t of Q)if(!u.txt.includes(t))return false}return true}
function filtra(){F=U.filter(u=>passa(u));ordena();desenha()}
function ordena(){const c=ORDEM.c,s=ORDEM.asc?1:-1;const key={emp:u=>u.emp+'|'+u.un,un:u=>u.emp+'|'+String(1000+u.pos.andarN).padStart(6,'0')+'|'+u.un,ana:u=>u.ag,cliA:u=>u.a_cliente||'',e:u=>u.es,cliE:u=>u.e_cliente||'',m:u=>u.ms,cliM:u=>u.m_cliente||'',cli:u=>u.cli,crit:u=>ORD[u.crit]+'|'+u.emp+u.un,venda:u=>u.e_data_venda||''}[c]||(u=>u.emp);
  F.sort((a,b)=>{const x=key(a),y=key(b);return x<y?-s:x>y?s:0})}
function facetas(){const h=[];
  for(const [k,t,fn,abre,ord] of FAC){const cont=new Map();for(const u of U){if(!passa(u,k))continue;const v=fn(u);for(const x of(Array.isArray(v)?v:[v]))cont.set(x,(cont.get(x)||0)+1)}
    const todos=new Set();for(const u of U){const v=fn(u);for(const x of(Array.isArray(v)?v:[v]))todos.add(x)}
    const s=SEL[k]||new Set();let L=[...todos].sort(ord||((a,b)=>k==='crit'?ORD[a]-ORD[b]:(cont.get(b)||0)-(cont.get(a)||0)||String(a).localeCompare(b)));
    const aberto=FECH[k]===undefined?abre:!FECH[k];
    h.push(`<div class="fac ${aberto?'':'fech'}" data-k="${k}"><h4 onclick="togFac('${k}')"><span>${t}${s.size?` · ${s.size}`:''}</span>${s.size?`<a onclick="event.stopPropagation();limpaFac('${k}')">limpar</a>`:''}</h4>
      <div class="fbt"><a onclick="todosFac('${k}')">selecionar todos</a><a onclick="invFac('${k}')">inverter</a><a onclick="limpaFac('${k}')">nenhum</a></div>
      ${L.length>12?`<input class="fsr" placeholder="filtrar opções" oninput="fFac(this)">`:''}
      <div class="ops">${L.map(v=>`<label class="op ${cont.get(v)?'':'z'}"><input type="checkbox" ${s.has(v)?'checked':''} data-k="${k}" data-v="${esc(v)}" onchange="marca(this)"><span class="l" title="${esc(v)}">${esc(v)}</span><span class="n">${fmt(cont.get(v)||0)}</span></label>`).join('')}</div></div>`)}
  $('#facs').innerHTML=h.join('')}
const FECH={};
function togFac(k){const e=document.querySelector(`.fac[data-k="${k}"]`);e.classList.toggle('fech');FECH[k]=e.classList.contains('fech')}
function fFac(i){const t=nm(i.value);i.parentElement.querySelectorAll('.op').forEach(o=>o.style.display=nm(o.textContent).includes(t)?'':'none')}
function marca(i){const k=i.dataset.k,v=i.dataset.v;SEL[k]=SEL[k]||new Set();i.checked?SEL[k].add(v):SEL[k].delete(v);tudo()}
function limpaFac(k){delete SEL[k];tudo()}
function valoresFac(k){const f=FAC.find(x=>x[0]===k)[2];const t=new Set();for(const u of U){const v=f(u);for(const x of(Array.isArray(v)?v:[v]))t.add(x)}return [...t]}
function visiveis(k){const e=document.querySelector(`.fac[data-k="${k}"]`);return e?[...e.querySelectorAll('.op')].filter(o=>o.style.display!=='none').map(o=>o.querySelector('input').dataset.v):null}
function todosFac(k){const vis=visiveis(k),all=valoresFac(k);SEL[k]=new Set(vis&&vis.length<all.length?vis.concat([...(SEL[k]||[])]):all);tudo()}
function invFac(k){const s=SEL[k]||new Set();SEL[k]=new Set(valoresFac(k).filter(v=>!s.has(v)));if(!SEL[k].size)delete SEL[k];tudo()}
function limpa(){for(const k in SEL)delete SEL[k];Q='';$('#q').value='';tudo()}
function setFiltro(k,v){for(const x in SEL)delete SEL[x];SEL[k]=new Set([v]);tudo()}
function tudo(){filtra();facetas();chips();kpis()}
function chips(){const h=[];for(const [k,t] of FAC){const s=SEL[k];if(!s||!s.size)continue;const all=valoresFac(k);
    if(s.size>8&&s.size>all.length/2){const fora=all.filter(v=>!s.has(v));h.push(`<span class="chip" title="limpar" onclick="limpaFac('${k}')">${esc(t)}: todos${fora.length?' menos '+esc(fora.slice(0,4).join(', '))+(fora.length>4?' (+'+(fora.length-4)+')':''):''} ×</span>`)}
    else for(const v of s)h.push(`<span class="chip" title="remover" onclick="SEL['${k}'].delete(this.dataset.v);tudo()" data-v="${esc(v)}">${esc(t)}: ${esc(v)} ×</span>`)}
  if(Q)h.push(`<span class="chip" onclick="Q='';$('#q').value='';tudo()">busca: ${esc($('#q').value)} ×</span>`);
  $('#chips').innerHTML=h.join('')||'<span class="cnt">Sem filtros: todas as unidades.</span>';$('#cnt').textContent=`${fmt(F.length)} de ${fmt(U.length)} unidades`}
function kpis(){const n=F.length,c=x=>F.filter(x).length;

  const cols=[...C.keys()].sort(ordC||((a,b)=>C.get(b)-C.get(a)));const rr=[...R.keys()].sort((a,b)=>R.get(b)-R.get(a));
  const m=new Map();for(const u of rows){const k=fr(u)+'\u0001'+fc(u);m.set(k,(m.get(k)||0)+1)}return {cols,rr,R,C,get:(r,c)=>m.get(r+'\u0001'+c)||0}}

   <tr class="tot"><td>Total</td>${x.cols.map(c=>`<td>${fmt(x.C.get(c))}</td>`).join('')}<td>${fmt(tot)}</td></tr></tbody></table></div>`}

  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(cz('118 \\ movfin',cruz(F,u=>u.es,u=>u.ms))),'118 x movfin');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(cz('Tipologia',cruz(F,u=>u.tip,u=>u.crit,oc))),'Por tipologia');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(cz('Andar',cruz(F,u=>u.andar,u=>u.crit,oc))),'Por andar');
  const al=[];for(const u of F)for(const [nv,t] of u.al)al.push({Empreendimento:u.emp,Unidade:u.un,'Nível':nv,Alerta:t,'Cliente 118':u.e_cliente||'','Cliente Anapro':u.a_cliente||'','Cliente movfin':u.m_cliente||''});
  al.sort((a,b)=>ORD[a['Nível']]-ORD[b['Nível']]);XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(al.length?al:[{Alerta:'nenhum'}]),'Alertas (1 por linha)');
  const nmA='Tabelao_'+new Date().toISOString().slice(0,10)+'_'+fmt(n).replace(/\./g,'')+'_unid.xlsx';XLSX.writeFile(wb,nmA);toast('<b>Exportado</b> '+nmA)}

   <h4 style="font-family:'Space Grotesk';color:var(--vinho);margin:18px 0 6px">De-para de empreendimentos</h4>

   <table class="rt"><thead><tr><th>Nome na fonte</th><th>Nome no Anapro</th><th>Obs.</th><th></th></tr></thead><tbody>${(INFO.depara||[]).map(d=>`<tr><td>${esc(d.origem)}</td><td>${esc(d.destino)}</td><td>${esc(d.obs||'')}</td><td><a href="#" onclick="event.preventDefault();salvaDepara('${esc(d.origem)}','${esc(d.destino)}',true)">remover</a></td></tr>`).join('')}</tbody></table>

   <h4 style="font-family:'Space Grotesk';color:var(--vinho);margin:18px 0 6px">Acessos</h4><div id="acc"><p class="note">Carregando…</p></div>

  rpc('tab_usuarios').then(L=>{$('#acc').innerHTML=`<table class="rt"><thead><tr><th>E-mail</th><th>Papel</th><th>Ativo</th><th>Último acesso</th></tr></thead><tbody>${L.map(x=>`<tr><td>${esc(x.email)}</td><td>${x.papel}</td><td>${x.ativo?'sim':'bloqueado'}</td><td>${esc(x.ultimo_acesso||'—')}</td></tr>`).join('')}</tbody></table>`}).catch(e=>$('#acc').innerHTML='<p class="note">'+esc(msgErro(e))+'</p>')}
async function salvaAcesso(at){const em=$('#ace').value.trim();if(!em)return toast('Informe o e-mail',1);

/* leitura de planilha -> linhas {coluna: texto} */
const snake=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
const p2=n=>String(n).padStart(2,'0');
function celula(c){if(!c)return null;
  if(c.t==='n'&&c.z&&XLSX.SSF.is_date(c.z)){const d=XLSX.SSF.parse_date_code(c.v);if(!d)return String(c.v);const s=`${d.y}-${p2(d.m)}-${p2(d.d)}`;return (d.H||d.M)?`${s} ${p2(d.H)}:${p2(d.M)}`:s}
  if(c.t==='d'&&c.v instanceof Date){const d=c.v;return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`}
  if(c.t==='b')return c.v?'SIM':'NÃO';if(c.t==='e')return null;
  const v=c.v;return v===undefined||v===null?null:String(v)}
async function leArquivo(fonte,nome,buf){
  const map=new Map((INFO.colunas[fonte]||[]).map(([c,r])=>[snake(r),c]));let head,linhas=[];
  if(/\.csv$/i.test(nome)){const txt=new TextDecoder('utf-8').decode(buf);const p=Papa.parse(txt,{skipEmptyLines:false});head=p.data[0];
    for(let i=1;i<p.data.length;i++){const r=p.data[i];if(!r.some(x=>String(x).trim()))continue;linhas.push({i:i+1,v:r})}
    const exato=new Map((INFO.colunas[fonte]||[]).map(([c,r])=>[String(r).trim(),c]));const idx=head.map(h=>exato.get(String(h).trim())||map.get(snake(h))),iLin=head.findIndex(h=>snake(h)==='linha_planilha');
    return {faltam:[...map.values()].filter(c=>!idx.includes(c)),rows:linhas.map(({i,v})=>{const o={linha:iLin>=0?parseInt(v[iLin])||i:i};idx.forEach((c,j)=>{if(c&&v[j]!==undefined&&String(v[j]).trim()!=='')o[c]=String(v[j])});return o})}}
  const wb=XLSX.read(buf,{type:'array',cellNF:true,cellDates:false,dense:false});
  const nomeAba=fonte==='erp118'&&wb.SheetNames.includes('Consulta1')?'Consulta1':fonte==='cadastro'&&wb.SheetNames.includes('BASE')?'BASE':wb.SheetNames[0];const ws=wb.Sheets[nomeAba];
  const rg=XLSX.utils.decode_range(ws['!ref']);head=[];for(let c=rg.s.c;c<=rg.e.c;c++){const x=ws[XLSX.utils.encode_cell({r:rg.s.r,c})];head.push(x?String(x.v):'')}
  const exato=new Map((INFO.colunas[fonte]||[]).map(([c,r])=>[String(r).trim(),c]));
  const usados=new Set(),idx=head.map(h=>{let c=exato.get(String(h).trim())||map.get(snake(h));if(c&&usados.has(c))c=map.has(snake(h)+'_2')&&!usados.has(c+'_2')?c+'_2':null;if(c)usados.add(c);return c});
  for(let r=rg.s.r+1;r<=rg.e.r;r++){const o={linha:r+1};let tem=false;for(let c=rg.s.c;c<=rg.e.c;c++){const col=idx[c-rg.s.c];if(!col)continue;const v=celula(ws[XLSX.utils.encode_cell({r,c})]);if(v!==null&&v.trim()!==''){o[col]=v;tem=true}}if(tem)linhas.push(o)}
  return {faltam:[...map.values()].filter(c=>!idx.includes(c)),rows:linhas,aba:nomeAba}}
async function sobe(fonte,nome,buf){
  load(true,'Lendo '+nome+'…','',2);await new Promise(r=>setTimeout(r,30));
  const L=await leArquivo(fonte,nome,buf);
  if(!L.rows.length)throw new Error('Nenhuma linha encontrada em '+nome);
  if(L.faltam.length>Math.max(3,(INFO.colunas[fonte]||[]).length/3))throw new Error(`O arquivo não parece ser da base ${fonte}: faltam as colunas ${L.faltam.slice(0,8).join(', ')}…`);
  const id=await rpc('tab_carga_iniciar',{p_fonte:fonte,p_arquivo:nome});const T=2000;let env=0;
  for(let i=0;i<L.rows.length;i+=T){await rpc('tab_carga_lote',{p_carga:id,p_linhas:L.rows.slice(i,i+T)});env+=Math.min(T,L.rows.length-i);
    load(true,'Enviando '+nome+'…',`${fmt(env)} de ${fmt(L.rows.length)} linhas`,100*env/L.rows.length)}
  await rpc('tab_carga_concluir',{p_carga:id});return {linhas:L.rows.length,faltam:L.faltam}}
async function reconstroi(){const E=['de-para do 118','de-para do movfin','juntando o Anapro','juntando o 118','juntando o movfin','fechando o tabelão','juntando o cadastro de empreendimentos'];
  for(let i=1;i<=E.length;i++){load(true,'Atualizando o tabelão…',`${i}/${E.length} · ${E[i-1]}`,100*(i-1)/E.length);await rpc('tab_reconstruir',{p_etapa:i})}
  load(true,'Atualizando o tabelão…','pronto',100);INFO=await rpc('tab_info');await recarrega()}
async function enviaFonte(f){const inp=$('#f_'+f);const fl=inp&&inp.files[0];if(!fl)return toast('Escolha o arquivo primeiro',1);
  try{const r=await sobe(f,fl.name,await fl.arrayBuffer());await reconstroi();fechaMd();toast(`<b>${fmt(r.linhas)} linhas enviadas</b>${r.faltam.length?' · colunas ausentes no arquivo: '+esc(r.faltam.join(', ')):''}`)}
  catch(e){load(false);toast('<b>Falhou:</b> '+esc(msgErro(e)),1)}}
async function cargaLocal(){try{for(const [f,arq] of (location.search.includes('so=cadastro')?[['cadastro','empreendimentos.csv']]:[['anapro','anapro.csv'],['erp118','erp118.xlsx'],['movfin','movfin.xlsx'],['cadastro','empreendimentos.csv']])){
    load(true,'Baixando '+arq+'…','',1);const b=await (await fetch('../_carga/'+arq)).arrayBuffer();await sobe(f,arq,b)}
  await reconstroi();fechaMd();toast('<b>Carga inicial concluída</b>')}catch(e){load(false);toast('<b>Falhou:</b> '+esc(msgErro(e)),1)}}
